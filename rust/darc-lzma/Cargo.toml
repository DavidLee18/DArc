# Fork of lzma-sdk-rs 0.2301.1 (BSD-3-Clause), vendored rather than depended on
# because DArc's LZMA is not stock LZMA -- see PROVENANCE.md for the divergence
# list and why a dependency could not express it.
[package]
name = "darc-lzma"
version = "0.1.0"
# The upstream is edition 2024; kept as-is so upstream diffs stay readable.
edition = "2024"
rust-version = "1.85"
license = "BSD-3-Clause AND GPL-3.0-or-later"
publish = false

[lib]
name = "darc_lzma"
path = "src/lib.rs"

[features]
default = []
decode = []
