[package]
name = "darc-codecs"
version = "0.1.0"
edition.workspace = true
license.workspace = true
# Ported DArc codecs, exposed under the same C ABI as the C originals so they
# can be swapped in one at a time without touching the rest of the build.
publish.workspace = true

[lib]
name = "darc_codecs"
crate-type = ["staticlib", "rlib"]   # staticlib to link; rlib so tests can use it

[features]
# The drop-in aliases (delta_compress, dict_decompress, ...) collide with the C
# implementations when both are linked, which is exactly what rust/difftest
# does to compare them. So they are opt-in: the archiver build enables this,
# the differential harness does not.
dropin = []

# Zstandard, via the zstd-safe binding. OFF by default and deliberately so:
# zstd-sys compiles the vendored zstd C sources, which means a build of this
# crate would need a C cross-compiler for every target the archiver ships to
# (x86_64-w64-mingw32-gcc, aarch64-w64-mingw32-clang, ...). Nothing in the
# archiver calls this module -- zstd is adopted but not yet wired, the C
# Compression/Zstd is still what runs -- so paying that toolchain cost by
# default buys nothing and blocks cross-compiling the codecs at all. Enable it
# when zstd is actually wired in.
zstd = ["dep:zstd-safe"]

[dependencies]
# Replaces Compression/LZ4 (5,163 LOC). DArc uses the raw LZ4 BLOCK format --
# LZ4_compress_default / LZ4_decompress_safe -- which is a fixed specification,
# so any conformant implementation reads any other's blocks. The version byte
# and int32 lengths around them are DArc's own framing and stay in C_LZ4.cpp.
#
# Encoder output is NOT byte-identical to the C library's: LZ4 is a
# match-finder and encoders legitimately differ. That is acceptable under the
# format-valid decision, and -mlz4 is not in the fingerprint suite, so no
# baseline moves.
lz4_flex = { workspace = true }
# "std" is required for the WriteBuf impl on Vec<u8>; "legacy" keeps the
# decoder able to read frames from zstd versions older than the vendored
# 1.5.6, which is the direction that matters for old archives.
zstd-safe = { version = "7.2", features = ["std", "legacy"], optional = true }

# SREP block-hash verification. These are the seedless standard hashes its
# -hash=md5/sha1/sha512 options select; each is a fixed reference algorithm, so
# a vetted crate is exact where a hand-port would only add risk. SREP's default
# (VMAC) and -hash=siphash are keyed constructions handled separately -- see
# srep/hashes.rs.
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"

[build-dependencies]
bindgen = "0.72"
