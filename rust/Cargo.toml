# Workspace for the Rust port of DArc.
#
# Members are added as each piece of the C/Haskell tree is replaced. The port
# proceeds codec by codec because archive-format compatibility is the binding
# constraint: wire format 0.51 must keep round-tripping with DArc86 and every
# released DArc, so a codec can only be swapped once its Rust implementation is
# proven equivalent against the C one (see difftest/ and Tests/interop-test.sh).
[workspace]
resolver = "2"
members = ["darc-arc", "darc-codecs", "darc-crypto", "darc-lzma", "darc-sevenz", "darc-unarc"]

[workspace.package]
edition = "2021"
license = "GPL-3.0-or-later"
publish = false
# The released version, in ONE place -- every member inherits it with
# `version.workspace = true`.
#
# This is not decoration. `CARGO_PKG_VERSION` is user-visible: fetch.rs sends it
# as the HTTP User-Agent for `--original=<url>`. It read 0.1.0 through v1, v2 and
# the whole port, so every release so far has identified itself to remote servers
# as a pre-release of something. release.yml checks this against the tag it is
# building, so the two cannot drift apart again.
version = "3.0.2"

# Vendored C is replaced by a dependency here ONLY where a crate exists that can
# actually stand in. That is a much shorter list than it looks, so the versions
# live here to keep the decision in one reviewable place:
#
# ADOPTED
#   lz4_flex    pure Rust, replaced Compression/LZ4         (5,163 LOC of C)
#   zstd-safe   binding; replaced Compression/Zstd/libzstd (32,375 LOC of C).
#               Bundles zstd 1.5.7 against the vendored 1.5.6 -- same frame
#               format, verified by decoding 1.5.6's own output.
#   serpent     replaces the Serpent cipher in Compression/_Encryption. DArc's
#               Serpent is standard Serpent, so the crate substitutes directly;
#               checked against x86-64 DArc's own vectors in
#               darc-crypto/tests/serpent_vectors.rs. (It was briefly thought
#               non-standard -- that was ARM64 miscompiling ulong32, see below.)
#
# REJECTED, each after measuring rather than assuming. Do not re-try these
# without new evidence:
#
#   ppmd-rust   DIFFERENT STREAM. DArc's PPMd is Shkarin var.H with Subbotin's
#               carryless range coder (32-bit low, TOP=1<<24) and MAX_O=128;
#               ppmd-rust is 7-Zip's Ppmd7 with Pavlov's range coder (64-bit
#               Low) and max order 64. Same model, incompatible bytes -- it
#               could not read a single existing -mppmd archive.
#
#   lzma-rs     ENCODER IS A STUB. Its raw decoder does read DArc's headerless
#               LZMA1 streams when lc/lp/pb are supplied (feature
#               "raw_decoder"), so the compatibility direction works. But
#               measured against the 7-Zip SDK on the same input: 32,329 bytes
#               against 118 on repetitive text (274x), and 50,872 against
#               65,536 input on mixed data where LZMA-9 reaches roughly 0.4.
#               Adopting it decode-only would remove no C and leave two
#               decoders to maintain, so LZMA stays on the SDK.
#
#   ruzstd      DECODE ONLY, so it cannot replace the encoder. zstd-safe was
#               taken instead.
#
#   NOTE ON THE ARM64 BUG that made serpent look un-adoptable: DArc's Serpent
#   is miscompiled on ARM64. tomcrypt_macros.h:13 types ulong32 as 64-bit on
#   every LP64 target except x86_64, and serpent.c's key expansion rotates it
#   with a raw shift-or that only works at 32 bits. So an ARM64 C build of DArc
#   encrypts -ae serpent differently from x86-64, and LTC_NO_TEST hides the
#   failing self-test. Adopting the crate produces CORRECT Serpent everywhere,
#   which is the desirable fix but means a Rust ARM64 build and a C ARM64 build
#   disagree on -ae serpent. See rust/cryptref/serpent32.c.
#
# There is NO crate for libbsc, and none for any of the DArc-specific codecs --
# Tornado, GRZip, MM/TTA, DisPack, REP, Dict, LZP, Delta, 4x4, SREP. Those are
# Bulat Ziganshin's own formats; "add a package line" is not available for them
# and they have to be hand-ported. That is ~15k lines of C before counting BSC.
[workspace.dependencies]
lz4_flex = { version = "0.14", default-features = false, features = ["std"] }

# Kept from the darc-codecs manifest, where it had no effect once the crate
# became a workspace member: cargo only honours [profile] in the workspace
# root. See src/ffi.rs for why the ported codecs want wrapping arithmetic to
# trap rather than wrap silently.
[profile.release]
overflow-checks = true

# Issue #171 asked for debug info to be left out of release binaries. MEASURED
# first, because the premise was wrong: cargo's release profile already sets
# `debug = false`, and a release `darc` carries ZERO DWARF --
#
#   otool -l darc | grep -c __debug   ->  0
#   nm darc | wc -l                   ->  10872
#
# -- so `strip -S`, which removes debug info, removed 56 BYTES. What mingw's
# strip.exe was actually deleting, and what the 9.5 MB -> 7 MB in that issue
# measures, is the SYMBOL TABLE. Hence "symbols" and not "debuginfo": the
# latter is the option that matches the issue's words and it would have shipped
# a no-op.
#
# Local macOS measurement OF THIS CHANGE (not of the strip(1) probe -- cargo's
# -Cstrip=symbols beats it, which is why these are the rebuilt numbers):
#
#   darc    5,761,376 -> 4,763,712   -17.3%   symbols 10872 -> 161
#   unarc   1,513,888 -> 1,270,976   -16.0%   symbols  2727 -> 132
#
# Both measured with release.yml's OWN build -- two separate cargo invocations,
# one per binary. Building them in one invocation unifies features differently
# and gives a 1,320,496 unarc, so a baseline taken that way would have been
# comparing two build configurations rather than this setting.
#
# The Windows figures are the ones the issue quotes; CI prints bytes per build.
#
# STATICLIBS ARE UNAFFECTED, and that had to be checked rather than hoped:
# -Cstrip applies at link time, so libdarc_arc.a still exports its 10,845
# defined symbols. Had it stripped them, every difftest link would have failed
# -- and per docs/rust-workspace.md it would have failed on GNU ld only, which
# is to say in CI and never here.
#
# unarc's share is not just download size. unarc IS the SFX module -- `darc a
# -sfx<module>` PREPENDS it -- so every SFX archive this project produces gets
# smaller by whatever unarc loses: 242,912 bytes here, off every single one.
#
# WHAT THIS COSTS, measured rather than assumed:
#
#   KEPT    the panic message and its `file:line`. Those are compiled-in
#           strings and #[track_caller] payload, not symbol-table entries, so
#           `panicked at src/main.rs:1:28: index out of bounds` still prints
#           from a fully stripped binary. That is the diagnostic that names a
#           codec bug, and it survives.
#   LOST    `RUST_BACKTRACE=1` entirely. Not degraded to addresses -- it prints
#           the "some details are omitted" note and NO frames at all. Verified
#           on a stripped build, because "names become addresses" was my
#           assumption and it was wrong.
#
# Taken anyway: a backtrace needs an env var no user sets, the FFI paths wrap
# panics in catch_unwind and turn them into error returns before they surface,
# and a debug build recovers the backtrace when someone is actually debugging.
#
# It goes on [profile.release] and NOT on a separate dist profile. A profile
# only release.yml used would mean the bytes users receive were built by
# settings no push ever exercised -- the exact drift that stopped v3.0.0.
strip = "symbols"
