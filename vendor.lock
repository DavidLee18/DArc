# DArc vendored-library provenance lock.
#
# 'lib'  pins an upstream release: name version url archive-sha256 local-dir upstream-prefix
# 'file' records the SHA-256 of one vendored file as it exists in this tree.
#
# Tests/verify-vendor.sh checks local files against these hashes (offline, fast).
# With --upstream it re-downloads the pinned release and proves the tree is still
# byte-identical to it.
#
# Why: ~104k lines of third-party C were vendored with no record of which release
# they came from, so a pristine copy could not be told from a locally patched one,
# and upstream security fixes could not be pulled in without diffing by hand.
# All three libraries below were verified byte-identical to these releases.
#
# EVERY file under a vendored directory is locked, not just recognised source
# extensions. A first cut filtered on .c/.h/.cpp and silently omitted libbsc's
# CUDA sources and its VERSION/LICENSE files -- a lock with holes in it is worse
# than no lock, because it reads as coverage.
#
# Deliberately absent: LZMA (5 source files patched locally), and the FreeArc-native
# codecs (Tornado, GRZip, PPMD, MM, Dict, REP, Delta, DisPack), forked far past
# re-syncing. LibTomCrypt (_Encryption, 1.17) and the 7-Zip SDK have no upstream
# git tag to pin against.

