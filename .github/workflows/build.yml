name: Build CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
    - uses: actions/checkout@v6.0.2
      with:
        lfs: true
    - name: Install LLVM and Clang
      uses: KyleMayes/install-llvm-action@v2
      with:
        version: "21.1.8"
    - name: Install packages
      run: |
        sudo apt update
        sudo apt install -y liblua5.1-dev libncurses-dev libcurl-dev
    - name: Cache
      id: cache
      uses: actions/cache@v5.0.3
      with:
        path: ~/.ghcup/
        key: ${{ runner.os }}-build-${{ hashFiles('**/*') }}
        restore-keys: |
          ${{ runner.os }}-build-
          ${{ runner.os }}-
    - uses: haskell-actions/setup@v2.7.0
      if: steps.cache.outputs.cache-hit != 'true'
      with:
        ghc-version: '9.8.4'
    - name: Build
      run: |
        chmod +x compile*
        ./compile-O2
