name: Build CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-24.04-arm
          - os: windows-latest
            msys2_sys: UCRT64
            msys2_pkg_prefix: mingw-w64-ucrt-x86_64
          - os: windows-11-arm
            msys2_sys: CLANGARM64
            msys2_pkg_prefix: mingw-w64-clang-aarch64
    steps:
    - uses: actions/checkout@v6.0.2
      with:
        lfs: true

    # ── Linux steps ────────────────────────────────────────────────────────────
    - name: Install LLVM and Clang
      if: runner.os == 'Linux'
      uses: KyleMayes/install-llvm-action@v2
      with:
        version: "21.1.8"
    - name: Install packages (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y liblua5.1-dev libncurses-dev libcurl4-openssl-dev
    - name: Cache GHCup (Linux)
      if: runner.os == 'Linux'
      id: cache
      uses: actions/cache@v5.0.3
      with:
        path: ~/.ghcup/
        key: ${{ runner.os }}-${{ runner.arch }}-ghcup-9.8.4
    - uses: haskell-actions/setup@v2.7.0
      if: runner.os == 'Linux' && steps.cache.outputs.cache-hit != 'true'
      with:
        ghc-version: '9.8.4'
    - name: Build (Linux)
      if: runner.os == 'Linux'
      run: |
        chmod +x compile*
        ./compile-O2

    # ── Windows steps ──────────────────────────────────────────────────────────
    # GHC is not distributed as an MSYS2 pacman package; install via haskell-actions/setup
    # On ARM64 Windows, ghcup is not pre-installed; download it directly (x64 binary runs
    # under Windows on ARM x64 emulation) so haskell-actions/setup can find it in PATH.
    - name: Bootstrap ghcup (Windows ARM64)
      if: runner.os == 'Windows' && runner.arch == 'ARM64'
      shell: powershell
      run: |
        $ghcupVersion = "0.1.50.2"
        $url = "https://downloads.haskell.org/~ghcup/$ghcupVersion/x86_64-mingw64-ghcup-$ghcupVersion.exe"
        $dir = "$env:LOCALAPPDATA\ghcup\bin"
        New-Item -ItemType Directory -Force -Path $dir | Out-Null
        Invoke-WebRequest -Uri $url -OutFile "$dir\ghcup.exe"
        Add-Content $env:GITHUB_PATH $dir
    - name: Install GHC (Windows)
      if: runner.os == 'Windows'
      uses: haskell-actions/setup@v2.7.0
      with:
        ghc-version: '9.8.4'
    - name: Set up MSYS2 (Windows)
      if: runner.os == 'Windows'
      uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.msys2_sys }}
        update: true
        path-type: inherit
        install: >-
          ${{ matrix.msys2_pkg_prefix }}-clang
          ${{ matrix.msys2_pkg_prefix }}-lua51
          make
    - name: Build (Windows)
      if: runner.os == 'Windows'
      shell: msys2 {0}
      run: |
        ctempdir=/tmp/out/FreeArc
        ghctempdir=/tmp/out/FreeArc-ghc
        mkdir -p "$ghctempdir"
        mkdir -p "$ctempdir"

        # Windows defines (always 64-bit on these runners)
        defines="-DFREEARC_WIN -DFREEARC_INTEL_BYTE_ORDER -DFREEARC_64BIT -DWIN32 -D_WINDOWS"

        # Create a CI-compatible common.mak for Windows (no hardcoded GHC paths)
        cat > common.mak <<'EOF'
        DEFINES  = -DFREEARC_WIN -DFREEARC_INTEL_BYTE_ORDER -DFREEARC_64BIT -DWIN32 -D_WINDOWS
        TEMPDIR  = /tmp/out/FreeArc
        GCC      = clang++ -std=c++23
        EOF

        # Build Compression C modules (Windows: includes CLS)
        cd Compression
        make
        for dir in LZP REP Delta MM Tornado Dict PPMD GRZip LZMA External CLS _Encryption; do
          (cd "$dir" && make)
        done
        cd ..

        # Build top-level C modules (Environment.o, URL.o)
        make ALL

        # Build HsLua helper
        lua_cflags=$(pkg-config --cflags lua5.1 2>/dev/null || echo "")
        clang -c HsLua/src/ntrljmp.c -IHsLua/src $lua_cflags -o "$ctempdir/ntrljmp.o"

        # Lua link flags; Windows uses wininet instead of libcurl
        lua_libs=$(pkg-config --libs lua5.1 2>/dev/null || echo "-llua5.1")
        c_objs="$ctempdir/Environment.o $ctempdir/URL.o $ctempdir/Common.o \
          $ctempdir/CompressionLibrary.o $ctempdir/C_PPMD.o $ctempdir/C_LZP.o \
          $ctempdir/C_LZMA.o $ctempdir/C_BCJ.o $ctempdir/C_GRZip.o $ctempdir/C_Dict.o \
          $ctempdir/C_REP.o $ctempdir/C_MM.o $ctempdir/C_TTA.o $ctempdir/C_Tornado.o \
          $ctempdir/C_Delta.o $ctempdir/C_External.o $ctempdir/C_CLS.o \
          $ctempdir/C_Encryption.o $ctempdir/ntrljmp.o"
        c_libs="-lstdc++ -lwininet $lua_libs"

        # Build -optc defines for C files compiled by GHC
        optc_defines=""
        for d in $defines; do optc_defines="$optc_defines -optc${d}"; done

        ghc_jobs="-j$(nproc 2>/dev/null || echo 4)"
        mkdir -p Tests

        ghc --make Arc.hs \
          -iCompression -icompat-ghc -iHsLua/src \
          -threaded \
          -rtsopts \
          "-with-rtsopts=-N -qg0 -A8m -H128m -I0" \
          -O2 \
          -feager-blackholing \
          -XGHC2021 \
          -XLambdaCase \
          -XNondecreasingIndentation \
          -XUndecidableInstances \
          -XOverlappingInstances \
          -XNoMonomorphismRestriction \
          $ghc_jobs \
          $defines \
          $optc_defines \
          -optc-IHsLua/src -optc-I. -optc-ICompression \
          $(for f in $lua_cflags; do echo "-optc$f"; done) \
          $c_objs \
          $(for lib in $c_libs; do echo "-optl$lib"; done) \
          -odir "$ghctempdir" -hidir "$ghctempdir" \
          -o Tests/arc.exe

        rm -f Compression/CompressionLib_stub.?
