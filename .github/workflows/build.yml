name: Build CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Allows running the full matrix against any branch on demand, e.g. for a
  # stacked PR whose base is not main (which the triggers above would skip).
  workflow_dispatch:

permissions:
  contents: read

# Cancel a PR's earlier runs when a new commit supersedes them: pushing a
# follow-up leaves the previous run testing a SHA that is no longer HEAD, and
# this repo does not otherwise stop it -- a 12-job matrix kept running for an
# obsolete commit.
#
# `main` is deliberately EXCLUDED from cancellation. Each post-merge run is the
# verification signal for one specific merge, and merges land back to back here
# (#71 through #74 in a single session); cancelling an in-flight main run when
# the next merge arrives would silently destroy the evidence that the previous
# merge was good.
#
# Non-PR runs therefore get a group unique to the run itself, so they can
# neither cancel each other nor queue behind each other. Only pull_request runs
# share a group (keyed by PR number, which is stable across commits) and so only
# they cancel.
#
# The group expression is deliberately ONE line. Folding it with `>-` looks
# tidier but does not fold: YAML preserves newlines on continuation lines that
# are indented deeper than the first content line, so the group string ends up
# containing literal newlines. Verified by parsing the file, not by eye.
concurrency:
  group: build-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-24.04-arm
          - os: macos-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        lfs: false

    # Rust is no longer optional once DARC_RUST is the default: it compiles code
    # that ships in every binary. The version and the cross targets come from
    # rust-toolchain.toml so there is a single place to change them.
    - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
    - name: Cache cargo and the pinned toolchain
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          ~/.rustup/toolchains
          rust/target
        key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'rust/Cargo.lock') }}
        restore-keys: |
          cargo-${{ runner.os }}-${{ runner.arch }}-
    # ── Linux steps ────────────────────────────────────────────────────────────
    - name: Cache LLVM
      if: runner.os == 'Linux'
      id: cache-llvm
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ./llvm
        key: llvm-21.1.8-${{ runner.os }}-${{ runner.arch }}
    - name: Install LLVM and Clang
      if: runner.os == 'Linux'
      uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2
      with:
        version: "21.1.8"
        # Skip the download when the cache above already restored ./llvm.
        cached: ${{ steps.cache-llvm.outputs.cache-hit }}
    - name: Install packages (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        # cpphs is required by mhs to preprocess {-# LANGUAGE CPP #-} modules.
        # Its absence is why the build silently failed on every platform while
        # CI still reported success.
        sudo apt-get install -y liblua5.1-dev libncurses-dev libcurl4-openssl-dev cpphs
    # `make minstall` dominates the short jobs. Keyed on the pinned
    # MicroHs commit, so bumping the pin invalidates it.
    - name: Cache MicroHs
      if: runner.os == 'Linux'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.mcabal
          ~/.local/bin
        key: mcabal-${{ runner.os }}-${{ runner.arch }}-05a3fbd5d73ae6a37111a6ced5b57bb1717b8975
    - name: Install MicroHs (Linux)
      if: runner.os == 'Linux'
      run: |
        # Outside the guard: the cp below needs this directory whether or not
        # the cache hit. The mcabal cache key is shared by every Linux x64 job,
        # but only this one creates ~/.local/bin, so a cache saved by another
        # job restores ~/.mcabal without it.
        mkdir -p "$HOME/.local/bin"
        if [ ! -x "$HOME/.mcabal/bin/mhs" ]; then
          # Pin to a known-good commit used for this repository's MicroHs-only
          # architecture migration to keep CI deterministic across reruns.
          microhs_sha="05a3fbd5d73ae6a37111a6ced5b57bb1717b8975"
          microhs_tar="/tmp/microhs.tar.gz"
          # SHA-256 computed from the pinned archive URL:
          # https://github.com/augustss/MicroHs/archive/05a3fbd5d73ae6a37111a6ced5b57bb1717b8975.tar.gz
          microhs_expected_sha256="a1f85821cbae877d0ea3e173235d45c833d9145b2ca9e92e77d284b6730c63b6"
          curl -fsSL "https://github.com/augustss/MicroHs/archive/$microhs_sha.tar.gz" -o "$microhs_tar"
          echo "$microhs_expected_sha256  $microhs_tar" | sha256sum -c -
          tar -xzf "$microhs_tar" -C /tmp
          cd "/tmp/MicroHs-$microhs_sha"
          make minstall
        fi
        cp "$HOME/.mcabal/bin/mhs" "$HOME/.local/bin/mhs"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        # MicroHs also installs cpphs here, and mhs shells out to it for every
        # {-# LANGUAGE CPP #-} module. Copying only mhs left cpphs unreachable,
        # which is what broke the build while CI still reported success.
        echo "$HOME/.mcabal/bin" >> "$GITHUB_PATH"
    - name: Build (Linux)
      if: runner.os == 'Linux'
      run: |
        chmod +x compile*
        ./compile-O2

    # A build step that cannot fail is not a check. Assert the artifact exists
    # and actually runs before anything downstream is allowed to claim success.
    - name: Verify binary (Linux)
      if: runner.os == 'Linux'
      run: |
        test -f Tests/arc || { echo "::error::build produced no Tests/arc"; exit 1; }
        test -s Tests/arc || { echo "::error::Tests/arc is empty"; exit 1; }
        chmod +x Tests/arc
        # Exercise it for real: a binary that exists but cannot list its own
        # help is not a working archiver.
        ./Tests/arc --help > /tmp/arc-help.txt 2>&1 || true
        grep -qi 'command' /tmp/arc-help.txt || {
          echo "::error::Tests/arc did not produce recognisable help output"
          head -20 /tmp/arc-help.txt; exit 1; }
        echo "binary verified: $(wc -c < Tests/arc) bytes"

    # Round-trip every compression method and solid mode over a deterministic
    # corpus, then compare each archive against a recorded fingerprint.
    # The round-trip half catches data loss; the fingerprint half catches
    # archive-format drift, which is the failure mode that otherwise builds
    # cleanly and passes every other check.
    - name: Test (Linux)
      if: runner.os == 'Linux'
      run: |
        chmod +x Tests/*.sh
        Tests/run-tests.sh Tests/arc

    # MM's ':r1' byte reordering, which run-tests.sh does not reach: its edges
    # are at BLOCK boundaries, not file boundaries, so a normal corpus walks
    # past them. The transpose is parameterised by the block length, and only a
    # final short block can carry a partial sample -- which needs an input just
    # over the 1 MB first-block cut to reach at all. Sweeps every tail remainder
    # across nine channel/word geometries, plus inputs autodetection refuses (no
    # flags byte, so no length prefix may be written).
    - name: Test MM ':r1' reordering (Linux)
      if: runner.os == 'Linux'
      run: |
        chmod +x Tests/mm-reorder-check.sh
        Tests/mm-reorder-check.sh

    # ── macOS steps ────────────────────────────────────────────────────────────
    # macOS is in the matrix so the portability work stays honest. The README
    # has claimed macOS support for a long time while the build did not
    # actually work there; without a runner it would simply rot again.
    - name: Install packages (macOS)
      if: runner.os == 'macOS'
      run: |
        # No lua@5.1 here: Homebrew removed the formula, and ./compile builds
        # Lua from the copy vendored in HsLua/src regardless. Asking for it
        # only produced a red "No available formula" line in every macOS run
        # that had nothing to do with the build.
        brew install ncurses || true

    # `make minstall` dominates the short jobs. Keyed on the pinned
    # MicroHs commit, so bumping the pin invalidates it.
    - name: Cache MicroHs
      if: runner.os == 'macOS'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.mcabal
          ~/.local/bin
        key: mcabal-${{ runner.os }}-${{ runner.arch }}-05a3fbd5d73ae6a37111a6ced5b57bb1717b8975
    - name: Install MicroHs (macOS)
      if: runner.os == 'macOS'
      run: |
        if [ ! -x "$HOME/.mcabal/bin/mhs" ]; then
          microhs_sha="05a3fbd5d73ae6a37111a6ced5b57bb1717b8975"
          microhs_tar="/tmp/microhs.tar.gz"
          microhs_expected_sha256="a1f85821cbae877d0ea3e173235d45c833d9145b2ca9e92e77d284b6730c63b6"
          curl -fsSL "https://github.com/augustss/MicroHs/archive/$microhs_sha.tar.gz" -o "$microhs_tar"
          echo "$microhs_expected_sha256  $microhs_tar" | shasum -a 256 -c -
          tar -xzf "$microhs_tar" -C /tmp
          cd "/tmp/MicroHs-$microhs_sha"
          make minstall
        fi
        # mhs and cpphs both land here; putting the directory on PATH keeps them
        # at the same pinned version.
        echo "$HOME/.mcabal/bin" >> "$GITHUB_PATH"

    - name: Build (macOS)
      if: runner.os == 'macOS'
      run: |
        chmod +x compile*
        ./compile-O2

    - name: Verify binary (macOS)
      if: runner.os == 'macOS'
      run: |
        test -f Tests/arc || { echo "::error::build produced no Tests/arc"; exit 1; }
        test -s Tests/arc || { echo "::error::Tests/arc is empty"; exit 1; }
        chmod +x Tests/arc
        ./Tests/arc --help > /tmp/arc-help.txt 2>&1 || true
        grep -qi 'command' /tmp/arc-help.txt || {
          echo "::error::Tests/arc did not produce recognisable help output"
          head -20 /tmp/arc-help.txt; exit 1; }
        echo "binary verified: $(wc -c < Tests/arc) bytes"

    - name: Test (macOS)
      if: runner.os == 'macOS'
      run: |
        chmod +x Tests/*.sh
        Tests/run-tests.sh Tests/arc

  # ── Windows (cross-compiled from Linux) ─────────────────────────────────────
  # Windows is built here rather than on a Windows runner under MSYS2.
  #
  # The MSYS2 jobs ran compile-O2 -> ./compile, which hardcodes -DFREEARC_UNIX.
  # That compiles the Unix compat block in Compression/Common.h, whose
  # __cdecl/_stat/WINAPI/FARPROC definitions then collide with the real
  # windows.h reached via LZMA/Windows/Thread.h. They never produced a binary.
  #
  # compile-mhs-win64 builds the FREEARC_WIN path with the mingw-w64 cross
  # toolchain, which works, and Wine lets the result actually be exercised
  # instead of merely inspected.
  #
  # Trade-off worth knowing: this checks the Windows *binary*, not a Windows
  # *host*. Wine is not Windows, and nothing here covers the ARM64 Windows
  # target the old matrix nominally had (it installed x86-64 MSYS2 packages
  # anyway). Reinstating a native job is worthwhile once the FREEARC_WIN path
  # is known-good; that is easier to do from a working baseline than from a
  # job that has never once succeeded.
  windows-cross:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        lfs: false
    - name: Install cross toolchain and Wine
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends mingw-w64 mingw-w64-tools cpphs wine64 wine
    # `make minstall` dominates the short jobs. Keyed on the pinned
    # MicroHs commit, so bumping the pin invalidates it.
    - name: Cache MicroHs
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.mcabal
          ~/.local/bin
        key: mcabal-${{ runner.os }}-${{ runner.arch }}-05a3fbd5d73ae6a37111a6ced5b57bb1717b8975
    - name: Install MicroHs
      run: |
        if [ ! -x "$HOME/.mcabal/bin/mhs" ]; then
          microhs_sha="05a3fbd5d73ae6a37111a6ced5b57bb1717b8975"
          microhs_tar="/tmp/microhs.tar.gz"
          microhs_expected_sha256="a1f85821cbae877d0ea3e173235d45c833d9145b2ca9e92e77d284b6730c63b6"
          curl -fsSL "https://github.com/augustss/MicroHs/archive/$microhs_sha.tar.gz" -o "$microhs_tar"
          echo "$microhs_expected_sha256  $microhs_tar" | sha256sum -c -
          tar -xzf "$microhs_tar" -C /tmp
          cd "/tmp/MicroHs-$microhs_sha"
          make minstall
        fi
        echo "$HOME/.mcabal/bin" >> "$GITHUB_PATH"
    # The Rust codecs are built by default now, so this must precede the first
    # build, not follow it. Targets come from rust-toolchain.toml.
    - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
    - name: Cache cargo and the pinned toolchain
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          ~/.rustup/toolchains
          rust/target
        key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'rust/Cargo.lock') }}
        restore-keys: |
          cargo-${{ runner.os }}-${{ runner.arch }}-
    - name: Build (Windows cross)
      run: |
        chmod +x compile-win64-c compile-mhs-win64
        ./compile-mhs-win64
    # compile-mhs-win64 already checks the MZ signature, so this is about the
    # artifact reaching the workspace rather than re-deriving the same fact.
    - name: Verify binary
      run: |
        test -f Tests/arc-mhs-win64.exe || { echo "::error::no Tests/arc-mhs-win64.exe"; exit 1; }
        echo "binary verified: $(wc -c < Tests/arc-mhs-win64.exe) bytes"
    # A PE header only proves the toolchain was wired up. The first working
    # cross-build produced a valid image that printed its help and then failed
    # every archive operation, so run the thing.
    - name: Smoke-test under Wine
      run: |
        chmod +x Tests/win-test.sh
        Tests/win-test.sh
    # Uploaded so the interop jobs can exercise this exact binary without
    # rebuilding it, which also means they test what this job produced rather
    # than a second build of the same source.
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: arc-win-amd64
        path: Tests/arc-mhs-win64.exe
        if-no-files-found: error

    # The C-vs-Rust comparison this used to do went away with DARC_NO_RUST.
    # What replaced it is stronger and does not need a second build: each
    # ported codec is compared byte-for-byte against a *pinned* revision of the
    # C by its own harness in rust/difftest, so the check survives the C being
    # deleted from the tree.
    - name: Verify the Rust codecs actually linked
      run: |
        test -f Tests/arc-mhs-win64.exe || { echo "::error::no Windows binary"; exit 1; }
        # Presence alone would only prove the staticlib was linked, not that
        # anything reaches it. Absence of the C entry points is the stronger
        # half: tor_compress0 is the C encoder's template and would appear as an
        # instantiation if any C Tornado encoder were still being built, so if
        # it is gone the Rust one is necessarily what runs.
        syms=$("${LLVM_MINGW:-x86_64-w64-mingw32}-nm" Tests/arc-mhs-win64.exe 2>/dev/null)
        echo "$syms" | grep -q darc_rs_ \
          || { echo "::error::no darc_rs_* symbols -- the Rust codecs were not linked"; exit 1; }
        echo "$syms" | grep -q tor_compress0 \
          && { echo "::error::C Tornado encoder is still present -- the Rust port is not what runs"; exit 1; }
        echo "Rust codecs linked; no C Tornado encoder present"

  # ── Windows on ARM64 ────────────────────────────────────────────────────────
  # Split across two jobs because neither half can be done alone:
  #
  #   build   Debian's mingw-w64 packages x86_64 and i686 only, so this target
  #           needs llvm-mingw (Clang). Cross-compiling from Linux is the only
  #           option -- MicroHs would otherwise have to be bootstrapped on the
  #           Windows runner.
  #   test    Wine has no ARM64 emulation, so unlike windows-cross above there
  #           is no way to exercise the result on the machine that built it.
  #
  # The upside of that constraint is that this target gets tested on real
  # hardware rather than on Wine, which is the stronger of the two checks.
  windows-arm64-cross:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        lfs: false
    - name: Install llvm-mingw
      run: |
        set -euo pipefail
        # Pinned with a checksum for the same reason MicroHs is: the compiler is
        # part of what produces the shipped binary, so it should not drift
        # underneath us between runs.
        ver="20260616"
        tarball="llvm-mingw-$ver-ucrt-ubuntu-22.04-x86_64.tar.xz"
        sha256="534b92e067b22a6b4441f48ae9240a3341b17825d04d577eab0cf85c44b4deda"
        curl -fsSL "https://github.com/mstorsjo/llvm-mingw/releases/download/$ver/$tarball" -o /tmp/"$tarball"
        echo "$sha256  /tmp/$tarball" | sha256sum -c -
        tar -xJf /tmp/"$tarball" -C /opt
        echo "/opt/llvm-mingw-$ver-ucrt-ubuntu-22.04-x86_64/bin" >> "$GITHUB_PATH"
    - name: Install packages
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends cpphs
    # `make minstall` dominates the short jobs. Keyed on the pinned
    # MicroHs commit, so bumping the pin invalidates it.
    - name: Cache MicroHs
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.mcabal
          ~/.local/bin
        key: mcabal-${{ runner.os }}-${{ runner.arch }}-05a3fbd5d73ae6a37111a6ced5b57bb1717b8975
    - name: Install MicroHs
      run: |
        if [ ! -x "$HOME/.mcabal/bin/mhs" ]; then
          microhs_sha="05a3fbd5d73ae6a37111a6ced5b57bb1717b8975"
          microhs_tar="/tmp/microhs.tar.gz"
          microhs_expected_sha256="a1f85821cbae877d0ea3e173235d45c833d9145b2ca9e92e77d284b6730c63b6"
          curl -fsSL "https://github.com/augustss/MicroHs/archive/$microhs_sha.tar.gz" -o "$microhs_tar"
          echo "$microhs_expected_sha256  $microhs_tar" | sha256sum -c -
          tar -xzf "$microhs_tar" -C /tmp
          cd "/tmp/MicroHs-$microhs_sha"
          make minstall
        fi
        echo "$HOME/.mcabal/bin" >> "$GITHUB_PATH"
    # bindgen parses DArc's headers as C++, so it reads llvm-mingw's libc++ --
    # whose headers use __builtin_clzg (Clang 19+). llvm-mingw ships the clang
    # driver but no libclang.so, so bindgen otherwise falls back to whatever
    # older libclang is on the box and dies on that builtin. Same pinned LLVM
    # the Linux build job uses.
    - name: Cache LLVM
      id: cache-llvm
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ./llvm
        key: llvm-21.1.8-${{ runner.os }}-${{ runner.arch }}
    - name: Install LLVM and Clang (for bindgen)
      uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2
      with:
        version: "21.1.8"
        # Skip the download when the cache above already restored ./llvm.
        cached: ${{ steps.cache-llvm.outputs.cache-hit }}
    # Exported for EVERY later step, not just one: each cargo build in this job
    # runs bindgen, and attaching this to a single step is exactly how the first
    # build ended up on a stale libclang.
    - name: Point bindgen at the pinned libclang
      run: |
        test -d "$LLVM_PATH/lib" || { echo "::error::no $LLVM_PATH/lib"; exit 1; }
        echo "LIBCLANG_PATH=$LLVM_PATH/lib" >> "$GITHUB_ENV"
    # The Rust codecs are built by default now, so this must precede the first
    # build, not follow it. Targets come from rust-toolchain.toml.
    - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
    - name: Cache cargo and the pinned toolchain
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          ~/.rustup/toolchains
          rust/target
        key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'rust/Cargo.lock') }}
        restore-keys: |
          cargo-${{ runner.os }}-${{ runner.arch }}-
    - name: Build (Windows ARM64 cross)
      run: |
        chmod +x compile-win64-c compile-mhs-win64
        DARC_WIN_ARCH=aarch64 ./compile-mhs-win64
    # compile-mhs-win64 already checks the PE machine field against the
    # requested architecture, so a build that silently fell back to the host
    # toolchain fails there rather than being uploaded here.
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: arc-win-arm64
        path: Tests/arc-mhs-win-arm64.exe
        if-no-files-found: error

  windows-arm64-test:
    needs: [ windows-arm64-cross, interop-produce ]
    runs-on: windows-11-arm
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        lfs: false
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: arc-win-arm64
        path: Tests
    # Git Bash, so the same script that runs under Wine on Linux runs here with
    # the Wine prefix dropped.
    # Invoked through bash rather than directly: a Windows checkout does not
    # preserve the executable bit.
    - name: Smoke-test on native ARM64 Windows
      shell: bash
      run: bash Tests/win-test.sh Tests/arc-mhs-win-arm64.exe

    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: interop-linux
        path: interop
    # Own archives first. If this build cannot read back what it just wrote,
    # the codec is broken on Windows and any interop failure below is a
    # consequence rather than a finding -- which is exactly what this step
    # established for tta, whose malloc2d bug it found before the interop
    # check could mislead anyone into calling it a format divergence.
    - name: Round-trip this build's own archives
      shell: bash
      run: |
        set -euo pipefail
        tar -xf interop/corpus.tar -C interop
        bash Tests/interop-test.sh make  Tests/arc-mhs-win-arm64.exe interop/corpus out-arm64
        bash Tests/interop-test.sh check Tests/arc-mhs-win-arm64.exe interop/corpus out-arm64
    - name: Read Linux-written archives
      shell: bash
      run: |
        set -euo pipefail
        bash Tests/interop-test.sh check Tests/arc-mhs-win-arm64.exe interop/corpus interop/archives
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: interop-win-arm64
        path: out-arm64
        if-no-files-found: error

  # ── Cross-build archive interoperability ────────────────────────────────────
  # run-tests.sh only ever asks whether a build can read back its own archives.
  # Nothing asked whether the Windows builds -- which use a different compiler
  # over the same codec sources -- write archives the Linux build can read, or
  # the reverse. A build can pass every round-trip test while producing output
  # no other build can open, and compile-win64-c already warns that PPMD does
  # exactly that if its flags drift.
  #
  # interop-produce writes the reference archives; the two Windows jobs read
  # them and write their own; interop-verify reads those back on Linux. The
  # corpus is shipped between jobs rather than regenerated on each side, so a
  # corpus difference can never masquerade as a format incompatibility.
  #
  # This builds its own Linux binary rather than depending on the `build`
  # matrix: `needs` is job-level, so waiting on `build` would mean waiting on
  # the macOS leg too. A duplicate ~10-minute build that runs in parallel is
  # cheaper than serialising the whole Windows chain behind it.
  interop-produce:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        lfs: false
    - name: Cache LLVM
      id: cache-llvm
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ./llvm
        key: llvm-21.1.8-${{ runner.os }}-${{ runner.arch }}
    - uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2
      with:
        version: "21.1.8"
        # Skip the download when the cache above already restored ./llvm.
        cached: ${{ steps.cache-llvm.outputs.cache-hit }}
    - name: Install packages
      run: |
        sudo apt-get update
        sudo apt-get install -y liblua5.1-dev libncurses-dev libcurl4-openssl-dev cpphs
    # `make minstall` dominates the short jobs. Keyed on the pinned
    # MicroHs commit, so bumping the pin invalidates it.
    - name: Cache MicroHs
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.mcabal
          ~/.local/bin
        key: mcabal-${{ runner.os }}-${{ runner.arch }}-05a3fbd5d73ae6a37111a6ced5b57bb1717b8975
    - name: Install MicroHs
      run: |
        if [ ! -x "$HOME/.mcabal/bin/mhs" ]; then
          microhs_sha="05a3fbd5d73ae6a37111a6ced5b57bb1717b8975"
          microhs_expected_sha256="a1f85821cbae877d0ea3e173235d45c833d9145b2ca9e92e77d284b6730c63b6"
          curl -fsSL "https://github.com/augustss/MicroHs/archive/$microhs_sha.tar.gz" -o /tmp/microhs.tar.gz
          echo "$microhs_expected_sha256  /tmp/microhs.tar.gz" | sha256sum -c -
          tar -xzf /tmp/microhs.tar.gz -C /tmp
          cd "/tmp/MicroHs-$microhs_sha"
          make minstall
        fi
        echo "$HOME/.mcabal/bin" >> "$GITHUB_PATH"
    - name: Build
      run: |
        chmod +x compile*
        ./compile-O2
    - name: Write reference archives
      run: |
        set -euo pipefail
        chmod +x Tests/make-corpus.sh Tests/interop-test.sh
        ( cd Tests && ./make-corpus.sh corpus )
        Tests/interop-test.sh make Tests/arc Tests/corpus interop/archives
        # Tarred rather than shipped as loose files: artifact upload/download
        # does not preserve modes, and 218 files move faster as one.
        tar -cf interop/corpus.tar -C Tests corpus
        cp Tests/arc interop/arc
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: interop-linux
        path: interop
        if-no-files-found: error

  # amd64 is a separate job rather than more steps on windows-cross so that the
  # two do not serialise: windows-cross and interop-produce run in parallel and
  # this picks up both artifacts afterwards.
  interop-windows-amd64:
    needs: [ interop-produce, windows-cross ]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        lfs: false
    - name: Install Wine
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends wine64 wine
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: interop-linux
        path: interop
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: arc-win-amd64
        path: winbin
    - name: Set up Wine and a shim
      run: |
        set -euo pipefail
        tar -xf interop/corpus.tar -C interop
        chmod +x Tests/interop-test.sh
        # A .exe is not executable after an artifact round-trip, and the script
        # refuses to run a non-executable archiver.
        chmod +x winbin/arc-mhs-win64.exe
        export WINEDEBUG=-all WINEPREFIX="$HOME/.darc-wineprefix"
        wineboot -i >/dev/null 2>&1 || true
        # interop-test.sh runs one archiver binary; give it a Wine-invoking
        # shim so the script needs no notion of which platform it is driving.
        { echo '#!/bin/sh'
          echo 'export WINEDEBUG=-all WINEPREFIX="$HOME/.darc-wineprefix"'
          echo 'exec wine "$(dirname "$0")/arc-mhs-win64.exe" "$@"'
        } > winbin/arc
        chmod +x winbin/arc
    # Own archives first, for the same reason as the arm64 job: a build that
    # cannot read back what it just wrote has a codec bug, not an interop one.
    - name: Round-trip this build's own archives
      run: |
        set -euo pipefail
        Tests/interop-test.sh make  winbin/arc interop/corpus out-amd64
        Tests/interop-test.sh check winbin/arc interop/corpus out-amd64
    - name: Read Linux-written archives
      run: Tests/interop-test.sh check winbin/arc interop/corpus interop/archives
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: interop-win-amd64
        path: out-amd64
        if-no-files-found: error

  # The other direction: archives written by each Windows build, read back by
  # the Linux build that wrote the reference set.
  interop-verify:
    needs: [ interop-produce, interop-windows-amd64, windows-arm64-test ]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        lfs: false
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: interop-linux
        path: interop
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: interop-win-amd64
        path: from-amd64
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: interop-win-arm64
        path: from-arm64
    - name: Read Windows-written archives on Linux
      run: |
        set -euo pipefail
        tar -xf interop/corpus.tar -C interop
        chmod +x interop/arc Tests/interop-test.sh
        for src in from-amd64 from-arm64; do
          echo "=== archives written by ${src#from-} ==="
          Tests/interop-test.sh check interop/arc interop/corpus "$src"
        done
    # Byte identity is a far stronger guarantee than "reads back correctly": it
    # says two independently built compressors made the same decisions, not
    # merely compatible ones. It is enforced where it currently holds and
    # reported where it does not, because the two Windows targets differ:
    #
    #   linux vs windows-amd64   byte-identical on all 14 methods, measured.
    #                            GATED -- a regression here means a codec
    #                            started behaving differently under a different
    #                            compiler, which is worth failing over.
    #
    #   linux vs windows-arm64   differs on 12 of 14. Archives are valid and
    #                            read back correctly in both directions; they
    #                            are just compressed differently, mostly by
    #                            under 0.5% -- except -mtor, which is 35%
    #                            LARGER (34771 -> 47043 bytes for the identical
    #                            method spec, tor:434kb on both sides).
    #                            Reported, not gated, until it is understood;
    #                            gating it now would only pin it in place.
    #
    # What that gap is NOT, each established by measurement rather than by
    # argument. Recorded so the next attempt starts past them:
    #
    #   architecture     It is the toolchain. Building windows-amd64 with
    #                    llvm-mingw instead of mingw-gcc -- same architecture,
    #                    same host, same Wine -- reproduces the arm64 sizes
    #                    EXACTLY, all 14 of them. DARC_WIN_TOOLCHAIN=llvm in
    #                    compile-win64-c is what that experiment used and is
    #                    how to repeat it.
    #   thread count     -mt1 through -mt8 are byte-identical for every codec.
    #   memory limit     -lc1 through -lc128 move -mtor by 24 bytes, against a
    #                    12272-byte gap. Only -m9 responds to -lc at all.
    #   parameters       Both sides store the same spec, tor:434kb, so it is
    #                    not memory-driven parameter selection either.
    #   strict aliasing  The obvious suspect, and wrong. Adding
    #                    -fno-strict-aliasing changed the output by nothing at
    #                    all. It is still the correct flag -- see
    #                    compile-win64-c -- but it is not this.
    #   ARM64 per se     run-tests.sh checks the same committed fingerprints on
    #                    ubuntu-24.04-arm and macos-latest, and both match.
    #
    # Also not reproducible with Apple clang on macOS: neither -fstrict-aliasing
    # nor -O2 moves Tornado's output there. It is specific to llvm-mingw, so it
    # can only be observed in CI.
    #
    # Next step, untried: compile only Compression/Tornado with mingw-gcc while
    # the rest of the build uses llvm-mingw, to confirm the miscompilation is
    # in that translation unit rather than somewhere shared.
    - name: Compare archive bytes across builds
      run: |
        set -uo pipefail
        echo "method              linux == amd64   linux == arm64"
        drift=0
        for a in interop/archives/*.arc; do
          m=$(basename "$a" .arc)
          if cmp -s "$a" "from-amd64/$m.arc"; then x=same; else x=DIFFERS; drift=$((drift+1)); fi
          y=$(cmp -s "$a" "from-arm64/$m.arc" && echo same || echo DIFFERS)
          printf '%-20s %-16s %s\n' "$m" "$x" "$y"
        done
        echo
        if [ "$drift" -ne 0 ]; then
          echo "::error::windows-amd64 no longer produces byte-identical archives to linux ($drift method(s))"
          echo "That pair has been byte-identical on every method; a change here means a codec"
          echo "started making different decisions under mingw-gcc. Investigate before blessing."
          exit 1
        fi
        echo "windows-amd64 is byte-identical to linux on all $(ls interop/archives/*.arc | wc -l | tr -d " ") methods"

  # ── Rust workspace: unit and edge-case tests ────────────────────────────────
  # Distinct from rust-codecs below, which builds the archiver against the port
  # and compares whole archives. This runs the crate's own tests, and covers
  # what that cannot reach cheaply: malformed input, sizes on block boundaries,
  # and codecs driven round their read loop more than once.
  #
  # nextest rather than cargo test, for process isolation. The codecs keep
  # module-level state behind a C ABI, and a panic unwinding across that ABI is
  # undefined behaviour -- one test must not be able to take the run with it, or
  # to leave state that makes an unrelated test pass.
  rust-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        lfs: false
    - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
    - uses: taiki-e/install-action@10ddf82bb4948219b68187f154decde56c89ee88 # nextest
    - name: cargo nextest
      working-directory: rust
      run: cargo nextest run --profile ci
    # Warnings are not failures here yet: the crate carries dead code that is
    # scaffolding for codecs not ported yet, and denying it now would block the
    # port rather than improve it.
    - name: cargo clippy
      working-directory: rust
      run: cargo clippy --all-targets || true
    # Totality gate, across the WHOLE Rust workspace -- darc-codecs and
    # darc-crypto both. An exhaustive `match` with every arm named is preferred
    # over `if let`, so a branch carrying archive or crypto behaviour has to be
    # written down and cannot be silently absent -- that is the shape of the
    # Tornado presets 7-11 bug (#102) and of the lz4hc `Strategy` fall-through
    # this gate's own PR fixed.
    #
    # darc-crypto had zero `if let` when the gate was widened, so this costs
    # nothing today and is purely about keeping it that way.
    #
    # This is a grep because clippy cannot express it. There is no lint that bans
    # `if let`; the whole related family (`single_match`, `single_match_else`,
    # `manual_let_else`, `option_if_let_else`) points from `match` TOWARDS
    # `if let`, and `single_match` is warn-by-default, which is why the crate root
    # allows it. Totality is `deny(clippy::wildcard_enum_match_arm)` -- no `_ =>`,
    # so every arm is named -- plus this gate.
    #
    # `while let` and `let ... else` are deliberately NOT covered: the first is a
    # loop's termination condition, and the second must diverge in its `else`, so
    # both already write down what happens in the other case.
    - name: no `if let` in the Rust workspace
      run: |
        set -uo pipefail
        # -F for a literal match; the pattern must not be read as a regex.
        # --exclude-dir=target keeps build artefacts and vendored crate sources
        # out: `rust/target` contains third-party code this rule does not govern.
        # The two -v filters drop comment lines: `//` after the file:line prefix,
        # and `//!` module docs (the rule is documented in prose in lib.rs).
        # Single quotes throughout -- backticks inside double quotes would be
        # command substitution, and "if let" is not a command.
        hits=$(grep -rnF 'if let ' rust --include='*.rs' --exclude-dir=target \
                 | grep -Ev ':[0-9]+: *//' | grep -v '//!' || true)
        if [ -n "$hits" ]; then
          echo '::error::this workspace uses an exhaustive match, not if let. Offenders:'
          echo "$hits"
          exit 1
        fi
        echo 'no if let anywhere under rust/ (excluding target)'

  # ── Rust codec ports ────────────────────────────────────────────────────────
  # Two things are checked, and they are not the same thing:
  #
  #   1. The ported codec produces byte-identical output to the C original, over
  #      inputs built to exercise its heuristics (rust/difftest).
  #   2. The archiver built against it produces byte-identical archives, and the
  #      whole suite still passes.
  #
  # The second is what actually protects the archive format, and it is the check
  # that caught the port being linked in name only: an earlier wiring produced a
  # binary byte-identical to the C build because both defined the same symbol and
  # the linker never pulled the Rust one.
  # ── The differential harnesses, split four ways ─────────────────────────────
  #
  # These were one job running fifteen independent checks in sequence, and it
  # grew into the critical path for every merge -- consistently the last thing
  # standing while everything else had finished. Nothing here depends on
  # anything else here, so the only reason it was serial was that it was written
  # as one `run:` block.
  #
  # Three of the four need NO MicroHs. Only the encryption round-trip builds the
  # archiver; every harness compiles C references directly with clang, and
  # srep-check.sh builds its own reference from srep/compile, which is C too.
  # That removes a `make minstall` from three jobs' critical path.
  #
  # Two things are checked across all of them, and they are not the same:
  #
  #   1. The ported codec produces byte-identical output to the C original, over
  #      inputs built to exercise its heuristics (rust/difftest).
  #   2. The archiver built against it produces byte-identical archives, and the
  #      whole suite still passes.
  #
  # The second is what actually protects the archive format, and it is the check
  # that caught the port being linked in name only: an earlier wiring produced a
  # binary byte-identical to the C build because both defined the same symbol and
  # the linker never pulled the Rust one.
  rust-codecs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        lfs: false
    - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
    - name: Cache LLVM
      id: cache-llvm
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ./llvm
        key: llvm-21.1.8-${{ runner.os }}-${{ runner.arch }}
    - name: Install LLVM and Clang
      uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2
      with:
        version: "21.1.8"
        # Skip the download when the cache above already restored ./llvm.
        cached: ${{ steps.cache-llvm.outputs.cache-hit }}
    - name: Install packages
      run: |
        sudo apt-get update
        sudo apt-get install -y liblua5.1-dev libncurses-dev libcurl4-openssl-dev cpphs
    - name: Codec differential test (Rust vs C)
      run: |
        chmod +x rust/difftest/run.sh
        rust/difftest/run.sh diff

  # The sabotage suites: they mutate the port and require the differential tests
  # to notice. Split out because they are ~2 minutes of work that has nothing to
  # do with the harnesses above -- a test-of-the-tests, not a test.
  rust-codecs-sabotage:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        lfs: false
    - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
    - name: Cache LLVM
      id: cache-llvm
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ./llvm
        key: llvm-21.1.8-${{ runner.os }}-${{ runner.arch }}
    - name: Install LLVM and Clang
      uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2
      with:
        version: "21.1.8"
        # Skip the download when the cache above already restored ./llvm.
        cached: ${{ steps.cache-llvm.outputs.cache-hit }}
    - name: Install packages
      run: |
        sudo apt-get update
        sudo apt-get install -y liblua5.1-dev libncurses-dev libcurl4-openssl-dev cpphs
    # A differential test that has never failed proves nothing. This mutates the
    # port and asserts every mutation is caught by at least one input; it also
    # aborts if a mutation pattern no longer matches, because a mutation that
    # silently fails to apply reports as "0 detected" and reads like coverage.
    - name: Prove the differential test can fail
      run: |
        chmod +x rust/difftest/run.sh
        rust/difftest/run.sh sabotage

    # The same question for the Tornado encoder's unit tests, which cover what
    # the differential harness cannot reach: it breaks each encoder path in turn
    # and requires the suite to notice. It restores every file it touches on
    # exit, including on failure.
    - name: Prove the Tornado encoder tests can fail
      run: |
        chmod +x rust/difftest/tornado-encoder-sabotage.sh
        rust/difftest/tornado-encoder-sabotage.sh

  # The per-codec harnesses, split in two. They were 4m45s in one step -- the
  # largest single lump in CI -- and nine independent checks have no reason to
  # queue behind each other. Divided by measured cost, not alphabetically:
  # Tornado's two and BSC's LZ4-HC dominate the set.
  rust-codecs-a:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        lfs: false
    - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
    - name: Cache LLVM
      id: cache-llvm
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ./llvm
        key: llvm-21.1.8-${{ runner.os }}-${{ runner.arch }}
    - name: Install LLVM and Clang
      uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2
      with:
        version: "21.1.8"
        # Skip the download when the cache above already restored ./llvm.
        cached: ${{ steps.cache-llvm.outputs.cache-hit }}
    - name: Install packages
      run: |
        sudo apt-get update
        sudo apt-get install -y liblua5.1-dev libncurses-dev libcurl4-openssl-dev cpphs
    - name: Per-codec differential tests (REP, TTA, MM, LZP, Dict, LZ4-HC)
      run: |
        chmod +x rust/difftest/*.sh
        rust/difftest/rep-check.sh
        rust/difftest/tta-check.sh
        rust/difftest/mm-check.sh
        # LZP is ported in BOTH directions and its C is deleted, so this is the
        # only remaining oracle for it -- and it had no check script at all
        # until the C was pruned (lzp_ref.cpp sat orphaned; run.sh covers Delta).
        rust/difftest/lzp-check.sh
        # Dict was in exactly the same state LZP was, except the gap OUTLIVED
        # the deletion: dict_ref.cpp and dict_phase1_ref.cpp sat orphaned, no
        # check script existed, this workflow never named dict -- and the C was
        # deleted anyway. This is now the only oracle for it.
        rust/difftest/dict-check.sh
        # LZ4-HC is an ENCODER-side harness: it requires the Rust encoder to be
        # byte-identical to the C for every level DArc can select (1-9), and
        # decodes each block with the C decoder rather than lz4_flex.
        rust/difftest/lz4hc-check.sh
        # BCJ's x86 branch filter, which C_BCJ.cpp now routes to Rust. The corpus
        # deliberately includes real x86 binaries: random data almost never contains
        # the E8/E9 opcodes the filter acts on, so a random-only corpus passes with
        # the filter stubbed out. It also sweeps chunk sizes, because the filter
        # carries state across calls and that is where it breaks.
        rust/difftest/bcj-check.sh
        # The LZMA DECODER, which C_LZMA.cpp now routes to under DARC_RUST. 3,267
        # cases against DArc's own lzma_decompress, comparing four things per case:
        # the verdict, the FreeArc error code, the plaintext, and the consumed and
        # produced byte counts. The corpus is mostly adversarial -- 2,500 mutations,
        # 84 truncations, the props byte swept over all 256 values, hand-built
        # streams for the three sides of the distance check, and window-wrap cases --
        # because this decoder is what unarc and every SFX target run on hostile
        # input with no exception handling.
        LZMA_DEC_REQUIRE_RUST=1 rust/difftest/lzma-decode-check.sh
        # The LZMA ENCODER. Not called from C_LZMA.cpp yet, but byte-identical to
        # DArc's C across every configuration that wrapper accepts -- all five match
        # finders and both parsers.
        #
        # This harness is a gate, not a report: it fails on any divergence, and also
        # if no sliding-window comparison ran. The latter is not paranoia -- every
        # input in the original corpus was smaller than the smallest dictionary, so
        # the window never slid and a broken window passed 88/88.
        rust/difftest/lzma-gap-check.sh

  # Debug profile, on purpose. Every other codec job builds --release, where
  # `debug_assert!` compiles to nothing -- so the crate's 19 assertions are dead
  # in the only configuration otherwise tested. The Tornado presets 7-11
  # divergence was exactly that: a guard firing into the void. Removing the fix
  # makes this job report 80 panics naming the cause; the release harnesses
  # needed differential tracing to find the same thing.
  rust-codecs-debug-assert:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        lfs: false
    - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
    - name: Cache LLVM
      id: cache-llvm
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ./llvm
        key: llvm-21.1.8-${{ runner.os }}-${{ runner.arch }}
    - name: Install LLVM and Clang
      uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2
      with:
        version: "21.1.8"
        cached: ${{ steps.cache-llvm.outputs.cache-hit }}
    - name: Install packages
      run: |
        sudo apt-get update
        sudo apt-get install -y liblua5.1-dev libncurses-dev libcurl4-openssl-dev cpphs
    - name: Codecs under debug assertions
      run: |
        chmod +x rust/difftest/*.sh
        rust/difftest/debug-assert-check.sh

  rust-codecs-b:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        lfs: false
    - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
    - name: Cache LLVM
      id: cache-llvm
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ./llvm
        key: llvm-21.1.8-${{ runner.os }}-${{ runner.arch }}
    - name: Install LLVM and Clang
      uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2
      with:
        version: "21.1.8"
        # Skip the download when the cache above already restored ./llvm.
        cached: ${{ steps.cache-llvm.outputs.cache-hit }}
    - name: Install packages
      run: |
        sudo apt-get update
        sudo apt-get install -y liblua5.1-dev libncurses-dev libcurl4-openssl-dev cpphs
    - name: Per-codec differential tests (Tornado, GRZip, DisPack)
      run: |
        chmod +x rust/difftest/*.sh
        rust/difftest/tornado-check.sh
        rust/difftest/tornado-encode-check.sh
        rust/difftest/grzip-check.sh
        # grzip-check.sh covers the DECODER and the multi-block stream. This one
        # covers the six ENCODER stages individually -- ST4, MTF-Ari, BWT (fast
        # and strong), WFC-Ari and Rec -- which nothing else reaches, and it had
        # never been invoked here at all: every difftest is listed by name and
        # this name was missing, so the file passed locally and ran nowhere.
        # With GRZip's C now deleted these two are its only oracle.
        rust/difftest/grzip-stage-check.sh
        # 4x4 is NOT ported and will not be; this asks the other question --
        # whether substituting Rust codecs UNDER 4x4's framing changes the
        # stream. It matters because 3binary..9binary are `4x4:bNm:lzma:...`
        # (Compression.hs:474-481), so -m3..-m9 route $binary through it.
        #
        # It must not share a step with the tornado harnesses: it builds the
        # staticlib WITH --features dropin and they need it WITHOUT (the pinned
        # tornado_ccodec.cpp defines tor_decompress and would collide). Cargo
        # re-resolves per run, so sequential is fine; concurrent is not.
        rust/difftest/4x4-check.sh
        rust/difftest/dispack-check.sh
        # The other direction: DisPack's ENCODER must be byte-exact too, since
        # DisPack is one of DArc's own formats. Filtered output that merely
        # round-trips through our own decoder would still make archives that
        # older builds read differently.
        rust/difftest/dispack-filter-check.sh

  # BSC on its own: it is the largest codec and now carries five harnesses, two
  # of them encoder-side and one comparing 576 (parameter, input) pairs. Left in
  # with the rest it dominated the job.
  rust-codecs-bsc:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        lfs: false
    - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
    - name: Cache LLVM
      id: cache-llvm
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ./llvm
        key: llvm-21.1.8-${{ runner.os }}-${{ runner.arch }}
    - name: Install LLVM and Clang
      uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2
      with:
        version: "21.1.8"
        # Skip the download when the cache above already restored ./llvm.
        cached: ${{ steps.cache-llvm.outputs.cache-hit }}
    - name: Install packages
      run: |
        sudo apt-get update
        sudo apt-get install -y liblua5.1-dev libncurses-dev libcurl4-openssl-dev cpphs
    - name: BSC decoder differential tests
      run: |
        chmod +x rust/difftest/*.sh
        # Stage by stage (QLFC entropy, inverse BWT, inverse ST) then the whole
        # block codec end to end.
        rust/difftest/bsc-check.sh
        rust/difftest/bsc-bwt-check.sh
        rust/difftest/bsc-st-check.sh
        rust/difftest/bsc-full-check.sh

    - name: BSC encoder differential tests
      run: |
        chmod +x rust/difftest/*.sh
        # LZP, the compressor's first stage. Byte-identity, not round-tripping:
        # LZP output is what the block sorter and the entropy coder consume, so a
        # merely-legal encoding would change every -mbsc archive while decoding
        # perfectly. 576 (parameter, input) pairs, covering all six of the C's
        # encoder bodies -- they emit DIFFERENT bytes from each other, so the
        # grid is not redundant.
        rust/difftest/bsc-lzp-encode-check.sh
        # The QLFC forward transform: the stage all three encode bodies share.
        # Compares the rank array AND the MTF table, since the table is an
        # output that becomes the block's preamble.
        rust/difftest/bsc-qlfc-transform-check.sh
        # All three QLFC encoders, plus the coder layer above them (block
        # splitting and framing).
        rust/difftest/bsc-qlfc-encode-check.sh
        # The forward sort-transform (ST3), BSC's alternative block sorter.
        # Compares the primary index as well as the bytes: the index alone
        # decides where the decoder starts unwinding.
        rust/difftest/bsc-st-encode-check.sh
        # The forward BWT. Not a translation of libsais: a string's suffixes all
        # have distinct lengths, so the suffix array has no ties to break and the
        # BWT is a function of it, which makes any correct construction produce
        # libsais's bytes. Verified before the port was written -- a qsort/memcmp
        # suffix array matched libsais over 21 inputs -- and held here against
        # SA-IS, for libsais_bwt, libsais_bwt_aux and the libbsc wrapper.
        rust/difftest/bsc-bwt-encode-check.sh

  # SREP is not an in-process codec: the archiver spawns a `srep` binary
  # (arc.ini's [External compressor:srep]), so this compares files rather than
  # callback streams and has no DARC_RUST/fingerprint story. srep-check.sh
  # builds the C reference from srep/compile itself, but that build is done here
  # too so a failure in it is attributed to SREP rather than to the differential
  # run. The harness forces -hash=md5, so the ARM64 VMAC issue documented in it
  # does not apply to this x86-64 runner regardless.
  rust-codecs-srep:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        lfs: false
    - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
    - name: Cache LLVM
      id: cache-llvm
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ./llvm
        key: llvm-21.1.8-${{ runner.os }}-${{ runner.arch }}
    - name: Install LLVM and Clang
      uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2
      with:
        version: "21.1.8"
        # Skip the download when the cache above already restored ./llvm.
        cached: ${{ steps.cache-llvm.outputs.cache-hit }}
    - name: Install packages
      run: |
        sudo apt-get update
        sudo apt-get install -y liblua5.1-dev libncurses-dev libcurl4-openssl-dev cpphs
    - name: SREP decoder differential test
      run: |
        chmod +x srep/compile rust/difftest/*.sh
        ( cd srep && ./compile )
        test -x Tests/srep || { echo "::error::srep/compile produced no Tests/srep"; exit 1; }
        rust/difftest/srep-check.sh

  # The C-vs-Rust crypto comparison. It compiles C_Encryption.cpp twice -- the
  # pinned copy without -DDARC_RUST so vendored LibTomCrypt runs, and the
  # working tree's copy with it so the production forwarding shim is what gets
  # tested -- and requires byte-identical ciphertext in both directions across
  # every cipher, mode and key size DArc can select, plus the PBKDF2 derivation.
  #
  # No MicroHs: it drives docrypt and Pbkdf2Hmac directly, not through arc.
  crypto-difftest:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        lfs: false
    - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
    - name: Cache LLVM
      id: cache-llvm
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ./llvm
        key: llvm-21.1.8-${{ runner.os }}-${{ runner.arch }}
    - name: Install LLVM and Clang
      uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2
      with:
        version: "21.1.8"
        # Skip the download when the cache above already restored ./llvm.
        cached: ${{ steps.cache-llvm.outputs.cache-hit }}
    - name: Install packages
      run: |
        sudo apt-get update
        sudo apt-get install -y liblua5.1-dev libncurses-dev libcurl4-openssl-dev cpphs
    - name: Encryption differential test (Rust vs C)
      run: |
        chmod +x rust/difftest/*.sh
        rust/difftest/crypto-check.sh

    # Seven one-line breaks -- CTR's counter direction, its state across
    # docrypt's 256 KB read chunk, CFB's feedback register and IV
    # pre-encryption, the PBKDF2 iteration count and two in the shim -- each of
    # which the check must notice. It restores every file it touches on exit,
    # including on failure.
    - name: Prove the encryption differential test can fail
      run: rust/difftest/crypto-sabotage.sh

  # PPMd gets a job of its own rather than a step in rust-codecs-* because the
  # grid is minutes rather than seconds: PPMd allocates a model heap per case
  # and the `dominant` corpus entry is pathologically slow at low order (in the
  # C as much as in the port). Too slow for a laptop, comfortable for a runner.
  #
  # NOTE the C driver is built with Compression/PPMD/makefile's WHOLE flag list
  # inside ppmd-check.sh, and that is not tidiness: PPMd type-puns through
  # `(WORD&)` in StateCpy/SWAP, so a compiler's aliasing assumptions change
  # rescale()'s result and THE SAME SOURCE EMITS DIFFERENT COMPRESSED BYTES.
  # `-fno-strict-aliasing` is the flag that decides it, so pinning the -O level
  # alone produces an oracle DArc does not ship. See the note in the script.
  rust-codecs-ppmd:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Sized from a measurement, not a guess: 8 pairs took 245s including the
      # builds, so ~25s per (order, budget) pair and 36 of them land near 15
      # minutes. Ignore the 634s this job once
      # reported for 14 pairs -- that run was dominated by a stray per-symbol
      # eprintln! in the port, not by the codec. The step below echoes the wall
      # clock, so trim or widen from what it actually reports.
      PPMD_ORDERS: "3 4 5 6 8 10 12 16 24"
      # The budgets are all SMALL on purpose. Only a budget the corpus can
      # exhaust changes anything: at order 16 the 150 KB noise input gives
      # different output at 1, 2 and 3 MB and byte-identical output at 4, 8 and
      # 16 MB, because without exhaustion the model never restarts and the
      # budget stops being an input at all. So three budgets that exhaust, and
      # 8 MB as the control that does not -- adding 16 MB would buy a duplicate
      # of the 8 MB column.
      PPMD_MEMS: "1 2 3 8"
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        lfs: false
    - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
    - name: Cache LLVM
      id: cache-llvm
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ./llvm
        key: llvm-21.1.8-${{ runner.os }}-${{ runner.arch }}
    - name: Install LLVM and Clang
      uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2
      with:
        version: "21.1.8"
        # Skip the download when the cache above already restored ./llvm.
        cached: ${{ steps.cache-llvm.outputs.cache-hit }}
    - name: Install packages
      run: |
        sudo apt-get update
        sudo apt-get install -y liblua5.1-dev libncurses-dev libcurl4-openssl-dev cpphs
    - name: PPMd differential test, wide grid (Rust vs the C as shipped)
      run: |
        chmod +x rust/difftest/*.sh
        start=$(date +%s)
        rust/difftest/ppmd-check.sh
        echo "ppmd-check wall clock: $(( $(date +%s) - start ))s"
    - name: PPMd suballocator differential test
      # Its own cap, well under the job's. Without one, this step once ran 48
      # minutes on the job's 60-minute budget and took the whole job down as
      # `cancelled` -- hiding a grid that had passed in 634s twenty minutes
      # earlier. The script caps each driver run internally too; this is the
      # backstop for the case where that cap is the thing that breaks.
      timeout-minutes: 10
      run: rust/difftest/ppmd-alloc-check.sh

  # The one job here that needs the archiver, and therefore MicroHs. The
  # C-vs-Rust crypto comparison is crypto-difftest above; this is the other
  # half -- encrypted archives must still be created and read back correctly.
  encryption-roundtrip:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        lfs: false
    - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
    - name: Cache LLVM
      id: cache-llvm
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ./llvm
        key: llvm-21.1.8-${{ runner.os }}-${{ runner.arch }}
    - name: Install LLVM and Clang
      uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2
      with:
        version: "21.1.8"
        # Skip the download when the cache above already restored ./llvm.
        cached: ${{ steps.cache-llvm.outputs.cache-hit }}
    - name: Install packages
      run: |
        sudo apt-get update
        sudo apt-get install -y liblua5.1-dev libncurses-dev libcurl4-openssl-dev cpphs
    # `make minstall` dominates the short jobs. Keyed on the pinned
    # MicroHs commit, so bumping the pin invalidates it.
    - name: Cache MicroHs
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.mcabal
          ~/.local/bin
        key: mcabal-${{ runner.os }}-${{ runner.arch }}-05a3fbd5d73ae6a37111a6ced5b57bb1717b8975
    - name: Install MicroHs
      run: |
        if [ ! -x "$HOME/.mcabal/bin/mhs" ]; then
          microhs_sha="05a3fbd5d73ae6a37111a6ced5b57bb1717b8975"
          microhs_tar="/tmp/microhs.tar.gz"
          microhs_expected_sha256="a1f85821cbae877d0ea3e173235d45c833d9145b2ca9e92e77d284b6730c63b6"
          curl -fsSL "https://github.com/augustss/MicroHs/archive/$microhs_sha.tar.gz" -o "$microhs_tar"
          echo "$microhs_expected_sha256  $microhs_tar" | sha256sum -c -
          tar -xzf "$microhs_tar" -C /tmp
          cd "/tmp/MicroHs-$microhs_sha"
          make minstall
        fi
        echo "$HOME/.mcabal/bin" >> "$GITHUB_PATH"

    # Builds the archiver itself. The deleted "archives identical with and
    # without the Rust codecs" step used to leave Tests/arc behind as a side
    # effect, and an earlier version of this silently depended on that.
    - name: Encrypted archives round-trip
      run: |
        chmod +x compile* Tests/*.sh
        ./compile > /tmp/build-enc.log 2>&1 || { tail -30 /tmp/build-enc.log; exit 1; }
        test -x Tests/arc || { echo "::error::./compile produced no Tests/arc"; exit 1; }
        Tests/enc-roundtrip.sh Tests/arc Tests/arc < /dev/null

  unarc-sfx:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        lfs: false
    - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
    - name: Cache cargo and the pinned toolchain
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          ~/.rustup/toolchains
          rust/target
        key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'rust/Cargo.lock') }}
        restore-keys: |
          cargo-${{ runner.os }}-${{ runner.arch }}-
    - name: Cache LLVM
      id: cache-llvm
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ./llvm
        key: llvm-21.1.8-${{ runner.os }}-${{ runner.arch }}
    - name: Install LLVM and Clang
      uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2
      with:
        version: "21.1.8"
        # Skip the download when the cache above already restored ./llvm.
        cached: ${{ steps.cache-llvm.outputs.cache-hit }}
    - name: Install packages
      run: |
        sudo apt-get update
        sudo apt-get install -y liblua5.1-dev libncurses-dev libcurl4-openssl-dev cpphs
    - name: Cache MicroHs
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.mcabal
          ~/.local/bin
        key: mcabal-${{ runner.os }}-${{ runner.arch }}-05a3fbd5d73ae6a37111a6ced5b57bb1717b8975
    - name: Install MicroHs
      run: |
        if [ ! -x "$HOME/.mcabal/bin/mhs" ]; then
          microhs_sha="05a3fbd5d73ae6a37111a6ced5b57bb1717b8975"
          microhs_tar="/tmp/microhs.tar.gz"
          microhs_expected_sha256="a1f85821cbae877d0ea3e173235d45c833d9145b2ca9e92e77d284b6730c63b6"
          curl -fsSL "https://github.com/augustss/MicroHs/archive/$microhs_sha.tar.gz" -o "$microhs_tar"
          echo "$microhs_expected_sha256  $microhs_tar" | sha256sum -c -
          tar -xzf "$microhs_tar" -C /tmp
          cd "/tmp/MicroHs-$microhs_sha"
          make minstall
        fi
        echo "$HOME/.mcabal/bin" >> "$GITHUB_PATH"

    # The archiver, because the round-trip needs something to write archives
    # with. ./compile also produces common.mak, which Unarc/makefile includes.
    - name: Build the archiver
      run: |
        chmod +x compile* Tests/*.sh
        ./compile > /tmp/build-arc.log 2>&1 || { tail -30 /tmp/build-arc.log; exit 1; }
        test -x Tests/arc || { echo "::error::./compile produced no Tests/arc"; exit 1; }

    - name: Build unarc and the SFX modules
      run: |
        mkdir -p /tmp/out/FreeArc-unarc
        make -C Unarc linux > /tmp/build-unarc.log 2>&1 || { tail -40 /tmp/build-unarc.log; exit 1; }
        for f in Unarc/unarc Unarc/arc.linux.sfx Unarc/arc-mini.linux.sfx Unarc/arc-tiny.linux.sfx; do
          test -x "$f" || { echo "::error::Unarc build produced no $f"; exit 1; }
        done
        # A DARC_RUST build must actually contain the Rust codecs.
        #
        # Checked through `strings`, not `nm`: the Unix link flags pass -s, so
        # these binaries are stripped and nm reports "no symbols" for a
        # perfectly good build. The first version of this check used nm and
        # failed the job while the build was fine.
        #
        # The marker is the source paths Rust embeds for panic locations --
        # roughly 45 of them from darc-codecs alone -- which survive stripping
        # because they are data, not symbols. Requiring several means one
        # incidental match cannot carry it.
        rust_paths=$(strings -a Unarc/unarc | grep -c 'darc-codecs/src/' || true)
        [ "${rust_paths:-0}" -ge 5 ] || {
          echo "::error::unarc contains $rust_paths darc-codecs source markers; the Rust staticlib was not linked in"
          exit 1; }
        echo "Rust codecs linked in: $rust_paths darc-codecs source markers"
        ls -la Unarc/unarc Unarc/*.sfx

    - name: Round-trip through unarc and a self-extracting archive
      run: Tests/sfx-roundtrip.sh Tests/arc Unarc/unarc Unarc/arc.linux.sfx

  # ── AddressSanitizer on x86-64 ──────────────────────────────────────────────
  # Added to diagnose a double free that only appeared on this runner. It found
  # that one and an out-of-bounds read in Dict/phase1 on its first two runs, and
  # now passes, so it is kept as a real check rather than deleted.
  #
  # It is deliberately NOT continue-on-error. That flag was right while the job
  # was expected to fail, but on a green job it would swallow exactly the
  # regressions this exists to catch.
  #
  # Cost: roughly doubles the Linux CI time. The memory bugs in this codebase
  # have consistently been invisible at every warning level, produced different
  # symptoms per platform, and in two cases corrupted the heap silently on
  # x86-64 while crashing elsewhere -- so the trade is worth it. If the time
  # becomes a problem, narrow the case list before dropping the job.
  asan-x86_64:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        lfs: false
    - name: Cache LLVM
      id: cache-llvm
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ./llvm
        key: llvm-21.1.8-${{ runner.os }}-${{ runner.arch }}
    - name: Install LLVM and Clang
      uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2
      with:
        version: "21.1.8"
        # Skip the download when the cache above already restored ./llvm.
        cached: ${{ steps.cache-llvm.outputs.cache-hit }}
    - name: Install packages
      run: |
        sudo apt-get update
        sudo apt-get install -y liblua5.1-dev libncurses-dev libcurl4-openssl-dev cpphs
    # `make minstall` dominates the short jobs. Keyed on the pinned
    # MicroHs commit, so bumping the pin invalidates it.
    - name: Cache MicroHs
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.mcabal
          ~/.local/bin
        key: mcabal-${{ runner.os }}-${{ runner.arch }}-05a3fbd5d73ae6a37111a6ced5b57bb1717b8975
    - name: Install MicroHs
      run: |
        if [ ! -x "$HOME/.mcabal/bin/mhs" ]; then
          microhs_sha="05a3fbd5d73ae6a37111a6ced5b57bb1717b8975"
          microhs_tar="/tmp/microhs.tar.gz"
          microhs_expected_sha256="a1f85821cbae877d0ea3e173235d45c833d9145b2ca9e92e77d284b6730c63b6"
          curl -fsSL "https://github.com/augustss/MicroHs/archive/$microhs_sha.tar.gz" -o "$microhs_tar"
          echo "$microhs_expected_sha256  $microhs_tar" | sha256sum -c -
          tar -xzf "$microhs_tar" -C /tmp
          cd "/tmp/MicroHs-$microhs_sha"
          make minstall
        fi
        echo "$HOME/.mcabal/bin" >> "$GITHUB_PATH"
    - name: Build with AddressSanitizer
      run: |
        chmod +x compile* Compression/compile
        DARC_SANITIZE=address ./compile
    # detect_leaks=0: this is a hunt for a specific heap-corruption bug, and
    # LeakSanitizer would otherwise bury the report under leaks inherited from
    # a codebase that has never been leak-clean.
    # abort_on_error=1 makes the first report terminate rather than letting a
    # corrupted process wander on and produce a confusing second failure.
    - name: Run suite under ASan
      env:
        ASAN_OPTIONS: detect_leaks=0:abort_on_error=1:print_stacktrace=1
      run: |
        chmod +x Tests/*.sh
        Tests/run-tests.sh Tests/arc
    # The suite hides per-case output on success, so surface any ASan report
    # that landed in a per-configuration log even when the case was recorded
    # as a failure rather than a crash.
    - name: Surface ASan reports
      if: always()
      run: |
        work="${TMPDIR:-/tmp}/darc-tests-work"
        found=0
        for f in "$work"/*.log; do
          [ -f "$f" ] || continue
          if grep -q "AddressSanitizer" "$f"; then
            found=1
            echo "::group::$(basename "$f")"
            cat "$f"
            echo "::endgroup::"
          fi
        done
        [ "$found" = 1 ] || echo "no AddressSanitizer reports found in $work"
