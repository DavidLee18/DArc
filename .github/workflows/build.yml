name: Build CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Allows running the full matrix against any branch on demand, e.g. for a
  # stacked PR whose base is not main (which the triggers above would skip).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-24.04-arm
          - os: windows-latest
            msys2_sys: UCRT64
            msys2_pkg_prefix: mingw-w64-ucrt-x86_64
          - os: windows-11-arm
            msys2_sys: UCRT64
            msys2_pkg_prefix: mingw-w64-ucrt-x86_64
    steps:
    - uses: actions/checkout@v6.0.2
      with:
        lfs: false

    # ── Linux steps ────────────────────────────────────────────────────────────
    - name: Install LLVM and Clang
      if: runner.os == 'Linux'
      uses: KyleMayes/install-llvm-action@v2
      with:
        version: "21.1.8"
    - name: Install packages (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        # cpphs is required by mhs to preprocess {-# LANGUAGE CPP #-} modules.
        # Its absence is why the build silently failed on every platform while
        # CI still reported success.
        sudo apt-get install -y liblua5.1-dev libncurses-dev libcurl4-openssl-dev cpphs
    - name: Install MicroHs (Linux)
      if: runner.os == 'Linux'
      run: |
        mkdir -p "$HOME/.local/bin"
        # Pin to a known-good commit used for this repository's MicroHs-only
        # architecture migration to keep CI deterministic across reruns.
        microhs_sha="05a3fbd5d73ae6a37111a6ced5b57bb1717b8975"
        microhs_tar="/tmp/microhs.tar.gz"
        # SHA-256 computed from the pinned archive URL:
        # https://github.com/augustss/MicroHs/archive/05a3fbd5d73ae6a37111a6ced5b57bb1717b8975.tar.gz
        microhs_expected_sha256="a1f85821cbae877d0ea3e173235d45c833d9145b2ca9e92e77d284b6730c63b6"
        curl -fsSL "https://github.com/augustss/MicroHs/archive/$microhs_sha.tar.gz" -o "$microhs_tar"
        echo "$microhs_expected_sha256  $microhs_tar" | sha256sum -c -
        tar -xzf "$microhs_tar" -C /tmp
        cd "/tmp/MicroHs-$microhs_sha"
        make minstall
        cp "$HOME/.mcabal/bin/mhs" "$HOME/.local/bin/mhs"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        # MicroHs also installs cpphs here, and mhs shells out to it for every
        # {-# LANGUAGE CPP #-} module. Copying only mhs left cpphs unreachable,
        # which is what broke the build while CI still reported success.
        echo "$HOME/.mcabal/bin" >> "$GITHUB_PATH"
    - name: Build (Linux)
      if: runner.os == 'Linux'
      run: |
        chmod +x compile*
        ./compile-O2

    # A build step that cannot fail is not a check. Assert the artifact exists
    # and actually runs before anything downstream is allowed to claim success.
    - name: Verify binary (Linux)
      if: runner.os == 'Linux'
      run: |
        test -f Tests/arc || { echo "::error::build produced no Tests/arc"; exit 1; }
        test -s Tests/arc || { echo "::error::Tests/arc is empty"; exit 1; }
        chmod +x Tests/arc
        # Exercise it for real: a binary that exists but cannot list its own
        # help is not a working archiver.
        ./Tests/arc --help > /tmp/arc-help.txt 2>&1 || true
        grep -qi 'command' /tmp/arc-help.txt || {
          echo "::error::Tests/arc did not produce recognisable help output"
          head -20 /tmp/arc-help.txt; exit 1; }
        echo "binary verified: $(wc -c < Tests/arc) bytes"

    # Round-trip every compression method and solid mode over a deterministic
    # corpus, then compare each archive against a recorded fingerprint.
    # The round-trip half catches data loss; the fingerprint half catches
    # archive-format drift, which is the failure mode that otherwise builds
    # cleanly and passes every other check.
    - name: Test (Linux)
      if: runner.os == 'Linux'
      run: |
        chmod +x Tests/*.sh
        Tests/run-tests.sh Tests/arc

    # ── Windows steps ──────────────────────────────────────────────────────────
    - name: Set up MSYS2 (Windows)
      if: runner.os == 'Windows'
      uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.msys2_sys }}
        update: true
        path-type: inherit
        install: >-
          ${{ matrix.msys2_pkg_prefix }}-clang
          ${{ matrix.msys2_pkg_prefix }}-lua51
          curl
          make
    - name: Install MicroHs (Windows)
      if: runner.os == 'Windows'
      shell: msys2 {0}
      run: |
        # Install MSYS2 development tools needed for MicroHs compilation
        pacman -S --noconfirm --needed msys2-devel

        microhs_sha="05a3fbd5d73ae6a37111a6ced5b57bb1717b8975"
        microhs_tar="/tmp/microhs.tar.gz"
        microhs_expected_sha256="a1f85821cbae877d0ea3e173235d45c833d9145b2ca9e92e77d284b6730c63b6"
        curl -fsSL "https://github.com/augustss/MicroHs/archive/$microhs_sha.tar.gz" -o "$microhs_tar"
        echo "$microhs_expected_sha256  $microhs_tar" | sha256sum -c -
        tar -xzf "$microhs_tar" -C /tmp
        cd "/tmp/MicroHs-$microhs_sha"

        # Build MicroHs in MSYS environment (has Unix compatibility headers)
        export MSYSTEM=MSYS
        make minstall
      env:
        MSYSTEM: MSYS
    # mhs needs cpphs for {-# LANGUAGE CPP #-} modules. MicroHs' own install may
    # place it in ~/.mcabal/bin; if not, try pacman. Failure here is not fatal
    # on its own -- the compile script checks for cpphs explicitly and reports
    # a clear error -- but this gives it the best chance of being present.
    - name: Ensure cpphs (Windows)
      if: runner.os == 'Windows'
      shell: msys2 {0}
      run: |
        export PATH="$HOME/.mcabal/bin:$PATH"
        if command -v cpphs >/dev/null 2>&1; then
          echo "cpphs already available: $(command -v cpphs)"
        else
          pacman -S --noconfirm --needed cpphs 2>/dev/null \
            || echo "note: cpphs not installable via pacman; compile will report if it is required"
        fi

    - name: Build (Windows)
      if: runner.os == 'Windows'
      shell: msys2 {0}
      run: |
        export PATH="$HOME/.mcabal/bin:$PATH"
        cd "$GITHUB_WORKSPACE"
        chmod +x compile*
        ./compile-O2

    - name: Verify binary (Windows)
      if: runner.os == 'Windows'
      shell: msys2 {0}
      run: |
        cd "$GITHUB_WORKSPACE"
        bin=Tests/arc; [ -f Tests/arc.exe ] && bin=Tests/arc.exe
        test -f "$bin" || { echo "::error::build produced no $bin"; exit 1; }
        test -s "$bin" || { echo "::error::$bin is empty"; exit 1; }
        echo "binary verified: $bin ($(wc -c < "$bin") bytes)"
