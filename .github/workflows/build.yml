name: Build CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Allows running the full matrix against any branch on demand, e.g. for a
  # stacked PR whose base is not main (which the triggers above would skip).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-24.04-arm
          - os: macos-latest
    steps:
    - uses: actions/checkout@v6.0.2
      with:
        lfs: false

    # ── Linux steps ────────────────────────────────────────────────────────────
    - name: Install LLVM and Clang
      if: runner.os == 'Linux'
      uses: KyleMayes/install-llvm-action@v2
      with:
        version: "21.1.8"
    - name: Install packages (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        # cpphs is required by mhs to preprocess {-# LANGUAGE CPP #-} modules.
        # Its absence is why the build silently failed on every platform while
        # CI still reported success.
        sudo apt-get install -y liblua5.1-dev libncurses-dev libcurl4-openssl-dev cpphs
    - name: Install MicroHs (Linux)
      if: runner.os == 'Linux'
      run: |
        mkdir -p "$HOME/.local/bin"
        # Pin to a known-good commit used for this repository's MicroHs-only
        # architecture migration to keep CI deterministic across reruns.
        microhs_sha="05a3fbd5d73ae6a37111a6ced5b57bb1717b8975"
        microhs_tar="/tmp/microhs.tar.gz"
        # SHA-256 computed from the pinned archive URL:
        # https://github.com/augustss/MicroHs/archive/05a3fbd5d73ae6a37111a6ced5b57bb1717b8975.tar.gz
        microhs_expected_sha256="a1f85821cbae877d0ea3e173235d45c833d9145b2ca9e92e77d284b6730c63b6"
        curl -fsSL "https://github.com/augustss/MicroHs/archive/$microhs_sha.tar.gz" -o "$microhs_tar"
        echo "$microhs_expected_sha256  $microhs_tar" | sha256sum -c -
        tar -xzf "$microhs_tar" -C /tmp
        cd "/tmp/MicroHs-$microhs_sha"
        make minstall
        cp "$HOME/.mcabal/bin/mhs" "$HOME/.local/bin/mhs"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        # MicroHs also installs cpphs here, and mhs shells out to it for every
        # {-# LANGUAGE CPP #-} module. Copying only mhs left cpphs unreachable,
        # which is what broke the build while CI still reported success.
        echo "$HOME/.mcabal/bin" >> "$GITHUB_PATH"
    - name: Build (Linux)
      if: runner.os == 'Linux'
      run: |
        chmod +x compile*
        ./compile-O2

    # A build step that cannot fail is not a check. Assert the artifact exists
    # and actually runs before anything downstream is allowed to claim success.
    - name: Verify binary (Linux)
      if: runner.os == 'Linux'
      run: |
        test -f Tests/arc || { echo "::error::build produced no Tests/arc"; exit 1; }
        test -s Tests/arc || { echo "::error::Tests/arc is empty"; exit 1; }
        chmod +x Tests/arc
        # Exercise it for real: a binary that exists but cannot list its own
        # help is not a working archiver.
        ./Tests/arc --help > /tmp/arc-help.txt 2>&1 || true
        grep -qi 'command' /tmp/arc-help.txt || {
          echo "::error::Tests/arc did not produce recognisable help output"
          head -20 /tmp/arc-help.txt; exit 1; }
        echo "binary verified: $(wc -c < Tests/arc) bytes"

    # Vendored third-party sources must still be what vendor.lock says they are.
    # Offline mode only -- cheap, no network. The stronger --upstream check
    # (re-download the pinned release and compare) is left for manual runs.
    - name: Verify vendored libraries (Linux)
      if: runner.os == 'Linux'
      run: |
        chmod +x Tests/verify-vendor.sh
        Tests/verify-vendor.sh

    # Round-trip every compression method and solid mode over a deterministic
    # corpus, then compare each archive against a recorded fingerprint.
    # The round-trip half catches data loss; the fingerprint half catches
    # archive-format drift, which is the failure mode that otherwise builds
    # cleanly and passes every other check.
    - name: Test (Linux)
      if: runner.os == 'Linux'
      run: |
        chmod +x Tests/*.sh
        Tests/run-tests.sh Tests/arc

    # ── macOS steps ────────────────────────────────────────────────────────────
    # macOS is in the matrix so the portability work stays honest. The README
    # has claimed macOS support for a long time while the build did not
    # actually work there; without a runner it would simply rot again.
    - name: Install packages (macOS)
      if: runner.os == 'macOS'
      run: |
        # No lua@5.1 here: Homebrew removed the formula, and ./compile builds
        # Lua from the copy vendored in HsLua/src regardless. Asking for it
        # only produced a red "No available formula" line in every macOS run
        # that had nothing to do with the build.
        brew install ncurses || true

    - name: Install MicroHs (macOS)
      if: runner.os == 'macOS'
      run: |
        microhs_sha="05a3fbd5d73ae6a37111a6ced5b57bb1717b8975"
        microhs_tar="/tmp/microhs.tar.gz"
        microhs_expected_sha256="a1f85821cbae877d0ea3e173235d45c833d9145b2ca9e92e77d284b6730c63b6"
        curl -fsSL "https://github.com/augustss/MicroHs/archive/$microhs_sha.tar.gz" -o "$microhs_tar"
        echo "$microhs_expected_sha256  $microhs_tar" | shasum -a 256 -c -
        tar -xzf "$microhs_tar" -C /tmp
        cd "/tmp/MicroHs-$microhs_sha"
        make minstall
        # mhs and cpphs both land here; putting the directory on PATH keeps them
        # at the same pinned version.
        echo "$HOME/.mcabal/bin" >> "$GITHUB_PATH"

    - name: Build (macOS)
      if: runner.os == 'macOS'
      run: |
        chmod +x compile*
        ./compile-O2

    - name: Verify binary (macOS)
      if: runner.os == 'macOS'
      run: |
        test -f Tests/arc || { echo "::error::build produced no Tests/arc"; exit 1; }
        test -s Tests/arc || { echo "::error::Tests/arc is empty"; exit 1; }
        chmod +x Tests/arc
        ./Tests/arc --help > /tmp/arc-help.txt 2>&1 || true
        grep -qi 'command' /tmp/arc-help.txt || {
          echo "::error::Tests/arc did not produce recognisable help output"
          head -20 /tmp/arc-help.txt; exit 1; }
        echo "binary verified: $(wc -c < Tests/arc) bytes"

    - name: Test (macOS)
      if: runner.os == 'macOS'
      run: |
        chmod +x Tests/*.sh
        Tests/run-tests.sh Tests/arc

  # ── Windows (cross-compiled from Linux) ─────────────────────────────────────
  # Windows is built here rather than on a Windows runner under MSYS2.
  #
  # The MSYS2 jobs ran compile-O2 -> ./compile, which hardcodes -DFREEARC_UNIX.
  # That compiles the Unix compat block in Compression/Common.h, whose
  # __cdecl/_stat/WINAPI/FARPROC definitions then collide with the real
  # windows.h reached via LZMA/Windows/Thread.h. They never produced a binary.
  #
  # compile-mhs-win64 builds the FREEARC_WIN path with the mingw-w64 cross
  # toolchain, which works, and Wine lets the result actually be exercised
  # instead of merely inspected.
  #
  # Trade-off worth knowing: this checks the Windows *binary*, not a Windows
  # *host*. Wine is not Windows, and nothing here covers the ARM64 Windows
  # target the old matrix nominally had (it installed x86-64 MSYS2 packages
  # anyway). Reinstating a native job is worthwhile once the FREEARC_WIN path
  # is known-good; that is easier to do from a working baseline than from a
  # job that has never once succeeded.
  windows-cross:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6.0.2
      with:
        lfs: false
    - name: Install cross toolchain and Wine
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends mingw-w64 mingw-w64-tools cpphs wine64 wine
    - name: Install MicroHs
      run: |
        microhs_sha="05a3fbd5d73ae6a37111a6ced5b57bb1717b8975"
        microhs_tar="/tmp/microhs.tar.gz"
        microhs_expected_sha256="a1f85821cbae877d0ea3e173235d45c833d9145b2ca9e92e77d284b6730c63b6"
        curl -fsSL "https://github.com/augustss/MicroHs/archive/$microhs_sha.tar.gz" -o "$microhs_tar"
        echo "$microhs_expected_sha256  $microhs_tar" | sha256sum -c -
        tar -xzf "$microhs_tar" -C /tmp
        cd "/tmp/MicroHs-$microhs_sha"
        make minstall
        echo "$HOME/.mcabal/bin" >> "$GITHUB_PATH"
    - name: Build (Windows cross)
      run: |
        chmod +x compile-win64-c compile-mhs-win64
        ./compile-mhs-win64
    # compile-mhs-win64 already checks the MZ signature, so this is about the
    # artifact reaching the workspace rather than re-deriving the same fact.
    - name: Verify binary
      run: |
        test -f Tests/arc-mhs-win64.exe || { echo "::error::no Tests/arc-mhs-win64.exe"; exit 1; }
        echo "binary verified: $(wc -c < Tests/arc-mhs-win64.exe) bytes"
    # A PE header only proves the toolchain was wired up. The first working
    # cross-build produced a valid image that printed its help and then failed
    # every archive operation, so run the thing.
    - name: Smoke-test under Wine
      run: |
        chmod +x Tests/win-test.sh
        Tests/win-test.sh
    # Uploaded so the interop jobs can exercise this exact binary without
    # rebuilding it, which also means they test what this job produced rather
    # than a second build of the same source.
    - uses: actions/upload-artifact@v4
      with:
        name: arc-win-amd64
        path: Tests/arc-mhs-win64.exe
        if-no-files-found: error

  # ── Windows on ARM64 ────────────────────────────────────────────────────────
  # Split across two jobs because neither half can be done alone:
  #
  #   build   Debian's mingw-w64 packages x86_64 and i686 only, so this target
  #           needs llvm-mingw (Clang). Cross-compiling from Linux is the only
  #           option -- MicroHs would otherwise have to be bootstrapped on the
  #           Windows runner.
  #   test    Wine has no ARM64 emulation, so unlike windows-cross above there
  #           is no way to exercise the result on the machine that built it.
  #
  # The upside of that constraint is that this target gets tested on real
  # hardware rather than on Wine, which is the stronger of the two checks.
  windows-arm64-cross:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6.0.2
      with:
        lfs: false
    - name: Install llvm-mingw
      run: |
        set -euo pipefail
        # Pinned with a checksum for the same reason MicroHs is: the compiler is
        # part of what produces the shipped binary, so it should not drift
        # underneath us between runs.
        ver="20260616"
        tarball="llvm-mingw-$ver-ucrt-ubuntu-22.04-x86_64.tar.xz"
        sha256="534b92e067b22a6b4441f48ae9240a3341b17825d04d577eab0cf85c44b4deda"
        curl -fsSL "https://github.com/mstorsjo/llvm-mingw/releases/download/$ver/$tarball" -o /tmp/"$tarball"
        echo "$sha256  /tmp/$tarball" | sha256sum -c -
        tar -xJf /tmp/"$tarball" -C /opt
        echo "/opt/llvm-mingw-$ver-ucrt-ubuntu-22.04-x86_64/bin" >> "$GITHUB_PATH"
    - name: Install packages
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends cpphs
    - name: Install MicroHs
      run: |
        microhs_sha="05a3fbd5d73ae6a37111a6ced5b57bb1717b8975"
        microhs_tar="/tmp/microhs.tar.gz"
        microhs_expected_sha256="a1f85821cbae877d0ea3e173235d45c833d9145b2ca9e92e77d284b6730c63b6"
        curl -fsSL "https://github.com/augustss/MicroHs/archive/$microhs_sha.tar.gz" -o "$microhs_tar"
        echo "$microhs_expected_sha256  $microhs_tar" | sha256sum -c -
        tar -xzf "$microhs_tar" -C /tmp
        cd "/tmp/MicroHs-$microhs_sha"
        make minstall
        echo "$HOME/.mcabal/bin" >> "$GITHUB_PATH"
    - name: Build (Windows ARM64 cross)
      run: |
        chmod +x compile-win64-c compile-mhs-win64
        DARC_WIN_ARCH=aarch64 ./compile-mhs-win64
    # compile-mhs-win64 already checks the PE machine field against the
    # requested architecture, so a build that silently fell back to the host
    # toolchain fails there rather than being uploaded here.
    - uses: actions/upload-artifact@v4
      with:
        name: arc-win-arm64
        path: Tests/arc-mhs-win-arm64.exe
        if-no-files-found: error

  windows-arm64-test:
    needs: [ windows-arm64-cross, interop-produce ]
    runs-on: windows-11-arm
    steps:
    - uses: actions/checkout@v6.0.2
      with:
        lfs: false
    - uses: actions/download-artifact@v4
      with:
        name: arc-win-arm64
        path: Tests
    # Git Bash, so the same script that runs under Wine on Linux runs here with
    # the Wine prefix dropped.
    # Invoked through bash rather than directly: a Windows checkout does not
    # preserve the executable bit.
    - name: Smoke-test on native ARM64 Windows
      shell: bash
      run: bash Tests/win-test.sh Tests/arc-mhs-win-arm64.exe

    - uses: actions/download-artifact@v4
      with:
        name: interop-linux
        path: interop
    # Own archives first. If this build cannot read back what it just wrote,
    # the codec is broken on Windows and any interop failure below is a
    # consequence rather than a finding -- which is exactly what this step
    # established for tta, whose malloc2d bug it found before the interop
    # check could mislead anyone into calling it a format divergence.
    - name: Round-trip this build's own archives
      shell: bash
      run: |
        set -euo pipefail
        tar -xf interop/corpus.tar -C interop
        bash Tests/interop-test.sh make  Tests/arc-mhs-win-arm64.exe interop/corpus out-arm64
        bash Tests/interop-test.sh check Tests/arc-mhs-win-arm64.exe interop/corpus out-arm64
    - name: Read Linux-written archives
      shell: bash
      run: |
        set -euo pipefail
        bash Tests/interop-test.sh check Tests/arc-mhs-win-arm64.exe interop/corpus interop/archives
    - uses: actions/upload-artifact@v4
      with:
        name: interop-win-arm64
        path: out-arm64
        if-no-files-found: error

  # ── TEMPORARY: is the arm64 archive difference the compiler or the arch? ────
  # windows-amd64 (GCC) writes archives byte-identical to Linux; windows-arm64
  # (Clang) does not, and -mtor comes out 35% larger there over the same corpus
  # with the identical method spec (tor:434kb both sides). Compiler and
  # architecture are confounded across those two builds.
  #
  # llvm-mingw supplies an x86_64 triple too, so this builds the SAME
  # architecture as the known-good amd64 build with the OTHER compiler and
  # compares the bytes. Clang+x86_64 differing means the compiler is the
  # trigger; matching means it is specific to ARM64-on-Windows.
  #
  # Delete this job once the question is answered.
  tornado-toolchain-probe:
    needs: interop-produce
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6.0.2
      with:
        lfs: false
    - name: Install llvm-mingw, Wine and cpphs
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends cpphs wine64 wine
        ver="20260616"
        tarball="llvm-mingw-$ver-ucrt-ubuntu-22.04-x86_64.tar.xz"
        sha256="534b92e067b22a6b4441f48ae9240a3341b17825d04d577eab0cf85c44b4deda"
        curl -fsSL "https://github.com/mstorsjo/llvm-mingw/releases/download/$ver/$tarball" -o /tmp/"$tarball"
        echo "$sha256  /tmp/$tarball" | sha256sum -c -
        tar -xJf /tmp/"$tarball" -C /opt
        echo "/opt/llvm-mingw-$ver-ucrt-ubuntu-22.04-x86_64/bin" >> "$GITHUB_PATH"
    - name: Install MicroHs
      run: |
        microhs_sha="05a3fbd5d73ae6a37111a6ced5b57bb1717b8975"
        microhs_expected_sha256="a1f85821cbae877d0ea3e173235d45c833d9145b2ca9e92e77d284b6730c63b6"
        curl -fsSL "https://github.com/augustss/MicroHs/archive/$microhs_sha.tar.gz" -o /tmp/microhs.tar.gz
        echo "$microhs_expected_sha256  /tmp/microhs.tar.gz" | sha256sum -c -
        tar -xzf /tmp/microhs.tar.gz -C /tmp
        cd "/tmp/MicroHs-$microhs_sha"
        make minstall
        echo "$HOME/.mcabal/bin" >> "$GITHUB_PATH"
    - name: Build windows-amd64 with Clang instead of GCC
      run: |
        chmod +x compile-win64-c compile-mhs-win64
        DARC_WIN_ARCH=x86_64 DARC_WIN_TOOLCHAIN=llvm ./compile-mhs-win64
    - uses: actions/download-artifact@v4
      with:
        name: interop-linux
        path: interop
    - name: Write archives with it and compare against linux
      run: |
        set -euo pipefail
        tar -xf interop/corpus.tar -C interop
        chmod +x Tests/interop-test.sh Tests/arc-mhs-win64.exe
        export WINEDEBUG=-all WINEPREFIX="$HOME/.darc-wineprefix"
        wineboot -i >/dev/null 2>&1 || true
        mkdir -p shim
        { echo '#!/bin/sh'
          echo 'export WINEDEBUG=-all WINEPREFIX="$HOME/.darc-wineprefix"'
          echo "exec wine $PWD/Tests/arc-mhs-win64.exe \"\$@\""
        } > shim/arc
        chmod +x shim/arc
        Tests/interop-test.sh make shim/arc interop/corpus out-clang-amd64
        echo
        echo "=== ANSWER ==="
        echo "method              size(linux)  size(clang-amd64)   bytes"
        for a in interop/archives/*.arc; do
          m=$(basename "$a" .arc); b="out-clang-amd64/$m.arc"
          [ -f "$b" ] || continue
          v=$(cmp -s "$a" "$b" && echo same || echo DIFFERS)
          printf '%-20s %11s %17s   %s\n' "$m" "$(wc -c < "$a")" "$(wc -c < "$b")" "$v"
        done
        echo
        echo "If tor DIFFERS here, the trigger is the COMPILER (Clang), not ARM64."
        echo "If tor is the same, the trigger is specific to ARM64-on-Windows."

  # ── Cross-build archive interoperability ────────────────────────────────────
  # run-tests.sh only ever asks whether a build can read back its own archives.
  # Nothing asked whether the Windows builds -- which use a different compiler
  # over the same codec sources -- write archives the Linux build can read, or
  # the reverse. A build can pass every round-trip test while producing output
  # no other build can open, and compile-win64-c already warns that PPMD does
  # exactly that if its flags drift.
  #
  # interop-produce writes the reference archives; the two Windows jobs read
  # them and write their own; interop-verify reads those back on Linux. The
  # corpus is shipped between jobs rather than regenerated on each side, so a
  # corpus difference can never masquerade as a format incompatibility.
  #
  # This builds its own Linux binary rather than depending on the `build`
  # matrix: `needs` is job-level, so waiting on `build` would mean waiting on
  # the macOS leg too. A duplicate ~10-minute build that runs in parallel is
  # cheaper than serialising the whole Windows chain behind it.
  interop-produce:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6.0.2
      with:
        lfs: false
    - uses: KyleMayes/install-llvm-action@v2
      with:
        version: "21.1.8"
    - name: Install packages
      run: |
        sudo apt-get update
        sudo apt-get install -y liblua5.1-dev libncurses-dev libcurl4-openssl-dev cpphs
    - name: Install MicroHs
      run: |
        microhs_sha="05a3fbd5d73ae6a37111a6ced5b57bb1717b8975"
        microhs_expected_sha256="a1f85821cbae877d0ea3e173235d45c833d9145b2ca9e92e77d284b6730c63b6"
        curl -fsSL "https://github.com/augustss/MicroHs/archive/$microhs_sha.tar.gz" -o /tmp/microhs.tar.gz
        echo "$microhs_expected_sha256  /tmp/microhs.tar.gz" | sha256sum -c -
        tar -xzf /tmp/microhs.tar.gz -C /tmp
        cd "/tmp/MicroHs-$microhs_sha"
        make minstall
        echo "$HOME/.mcabal/bin" >> "$GITHUB_PATH"
    - name: Build
      run: |
        chmod +x compile*
        ./compile-O2
    - name: Write reference archives
      run: |
        set -euo pipefail
        chmod +x Tests/make-corpus.sh Tests/interop-test.sh
        ( cd Tests && ./make-corpus.sh corpus )
        Tests/interop-test.sh make Tests/arc Tests/corpus interop/archives
        # Tarred rather than shipped as loose files: artifact upload/download
        # does not preserve modes, and 218 files move faster as one.
        tar -cf interop/corpus.tar -C Tests corpus
        cp Tests/arc interop/arc
    - uses: actions/upload-artifact@v4
      with:
        name: interop-linux
        path: interop
        if-no-files-found: error

  # amd64 is a separate job rather than more steps on windows-cross so that the
  # two do not serialise: windows-cross and interop-produce run in parallel and
  # this picks up both artifacts afterwards.
  interop-windows-amd64:
    needs: [ interop-produce, windows-cross ]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6.0.2
      with:
        lfs: false
    - name: Install Wine
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends wine64 wine
    - uses: actions/download-artifact@v4
      with:
        name: interop-linux
        path: interop
    - uses: actions/download-artifact@v4
      with:
        name: arc-win-amd64
        path: winbin
    - name: Set up Wine and a shim
      run: |
        set -euo pipefail
        tar -xf interop/corpus.tar -C interop
        chmod +x Tests/interop-test.sh
        # A .exe is not executable after an artifact round-trip, and the script
        # refuses to run a non-executable archiver.
        chmod +x winbin/arc-mhs-win64.exe
        export WINEDEBUG=-all WINEPREFIX="$HOME/.darc-wineprefix"
        wineboot -i >/dev/null 2>&1 || true
        # interop-test.sh runs one archiver binary; give it a Wine-invoking
        # shim so the script needs no notion of which platform it is driving.
        { echo '#!/bin/sh'
          echo 'export WINEDEBUG=-all WINEPREFIX="$HOME/.darc-wineprefix"'
          echo 'exec wine "$(dirname "$0")/arc-mhs-win64.exe" "$@"'
        } > winbin/arc
        chmod +x winbin/arc
    # Own archives first, for the same reason as the arm64 job: a build that
    # cannot read back what it just wrote has a codec bug, not an interop one.
    - name: Round-trip this build's own archives
      run: |
        set -euo pipefail
        Tests/interop-test.sh make  winbin/arc interop/corpus out-amd64
        Tests/interop-test.sh check winbin/arc interop/corpus out-amd64
    - name: Read Linux-written archives
      run: Tests/interop-test.sh check winbin/arc interop/corpus interop/archives
    - uses: actions/upload-artifact@v4
      with:
        name: interop-win-amd64
        path: out-amd64
        if-no-files-found: error

  # The other direction: archives written by each Windows build, read back by
  # the Linux build that wrote the reference set.
  interop-verify:
    needs: [ interop-produce, interop-windows-amd64, windows-arm64-test ]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6.0.2
      with:
        lfs: false
    - uses: actions/download-artifact@v4
      with:
        name: interop-linux
        path: interop
    - uses: actions/download-artifact@v4
      with:
        name: interop-win-amd64
        path: from-amd64
    - uses: actions/download-artifact@v4
      with:
        name: interop-win-arm64
        path: from-arm64
    - name: Read Windows-written archives on Linux
      run: |
        set -euo pipefail
        tar -xf interop/corpus.tar -C interop
        chmod +x interop/arc Tests/interop-test.sh
        for src in from-amd64 from-arm64; do
          echo "=== archives written by ${src#from-} ==="
          Tests/interop-test.sh check interop/arc interop/corpus "$src"
        done
    # Byte identity is a far stronger guarantee than "reads back correctly": it
    # says two independently built compressors made the same decisions, not
    # merely compatible ones. It is enforced where it currently holds and
    # reported where it does not, because the two Windows targets differ:
    #
    #   linux vs windows-amd64   byte-identical on all 14 methods, measured.
    #                            GATED -- a regression here means a codec
    #                            started behaving differently under a different
    #                            compiler, which is worth failing over.
    #
    #   linux vs windows-arm64   differs on 12 of 14. Archives are valid and
    #                            read back correctly in both directions; they
    #                            are just compressed differently, mostly by
    #                            under 0.5% -- except -mtor, which is 35%
    #                            LARGER on arm64 (34771 -> 47043 bytes). That
    #                            is a real compression-quality gap in the
    #                            llvm-mingw/Clang build and is tracked
    #                            separately. Reported, not gated, until it is
    #                            understood; gating it now would just pin the
    #                            defect in place.
    #
    # Not thread count and not memory: both were measured and neither changes
    # archive bytes. Nor is it ARM64 itself -- run-tests.sh checks the same
    # committed fingerprints on ubuntu-24.04-arm and macos-latest and they
    # match, so an ARM64 build per se produces identical output.
    - name: Compare archive bytes across builds
      run: |
        set -uo pipefail
        echo "method              linux == amd64   linux == arm64"
        drift=0
        for a in interop/archives/*.arc; do
          m=$(basename "$a" .arc)
          if cmp -s "$a" "from-amd64/$m.arc"; then x=same; else x=DIFFERS; drift=$((drift+1)); fi
          y=$(cmp -s "$a" "from-arm64/$m.arc" && echo same || echo DIFFERS)
          printf '%-20s %-16s %s\n' "$m" "$x" "$y"
        done
        echo
        if [ "$drift" -ne 0 ]; then
          echo "::error::windows-amd64 no longer produces byte-identical archives to linux ($drift method(s))"
          echo "That pair has been byte-identical on every method; a change here means a codec"
          echo "started making different decisions under mingw-gcc. Investigate before blessing."
          exit 1
        fi
        echo "windows-amd64 is byte-identical to linux on all $(ls interop/archives/*.arc | wc -l | tr -d " ") methods"

  # ── Rust codec ports ────────────────────────────────────────────────────────
  # Two things are checked, and they are not the same thing:
  #
  #   1. The ported codec produces byte-identical output to the C original, over
  #      inputs built to exercise its heuristics (rust/difftest).
  #   2. The archiver built against it produces byte-identical archives, and the
  #      whole suite still passes.
  #
  # The second is what actually protects the archive format, and it is the check
  # that caught the port being linked in name only: an earlier wiring produced a
  # binary byte-identical to the C build because both defined the same symbol and
  # the linker never pulled the Rust one.
  rust-codecs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6.0.2
      with:
        lfs: false
    - name: Install LLVM and Clang
      uses: KyleMayes/install-llvm-action@v2
      with:
        version: "21.1.8"
    - name: Install packages
      run: |
        sudo apt-get update
        sudo apt-get install -y liblua5.1-dev libncurses-dev libcurl4-openssl-dev cpphs
    - name: Install MicroHs
      run: |
        microhs_sha="05a3fbd5d73ae6a37111a6ced5b57bb1717b8975"
        microhs_tar="/tmp/microhs.tar.gz"
        microhs_expected_sha256="a1f85821cbae877d0ea3e173235d45c833d9145b2ca9e92e77d284b6730c63b6"
        curl -fsSL "https://github.com/augustss/MicroHs/archive/$microhs_sha.tar.gz" -o "$microhs_tar"
        echo "$microhs_expected_sha256  $microhs_tar" | sha256sum -c -
        tar -xzf "$microhs_tar" -C /tmp
        cd "/tmp/MicroHs-$microhs_sha"
        make minstall
        echo "$HOME/.mcabal/bin" >> "$GITHUB_PATH"

    - name: Codec differential test (Rust vs C)
      run: |
        chmod +x rust/difftest/run.sh
        rust/difftest/run.sh diff

    # A differential test that has never failed proves nothing. This mutates the
    # port and asserts every mutation is caught by at least one input; it also
    # aborts if a mutation pattern no longer matches, because a mutation that
    # silently fails to apply reports as "0 detected" and reads like coverage.
    - name: Prove the differential test can fail
      run: rust/difftest/run.sh sabotage

    # Build the archiver twice and require identical archives. This is the check
    # that actually guards the format.
    - name: Archives identical with and without the Rust codecs
      run: |
        chmod +x compile* Tests/*.sh
        ./compile > /tmp/build-c.log 2>&1 || { tail -30 /tmp/build-c.log; exit 1; }
        cp Tests/arc /tmp/arc-c
        Tests/run-tests.sh /tmp/arc-c > /tmp/suite-c.log 2>&1 || { tail -40 /tmp/suite-c.log; exit 1; }

        rm -rf /tmp/out/FreeArc
        DARC_RUST=1 ./compile > /tmp/build-rs.log 2>&1 || { tail -30 /tmp/build-rs.log; exit 1; }
        # If the Rust library were not really linked the binary would be
        # unchanged, which is exactly how this went wrong once.
        cmp -s /tmp/arc-c Tests/arc && { echo "::error::DARC_RUST build is byte-identical to the C build -- the Rust codecs were not linked"; exit 1; }
        Tests/run-tests.sh Tests/arc > /tmp/suite-rs.log 2>&1 || { tail -40 /tmp/suite-rs.log; exit 1; }

        grep -E "^[a-z0-9-]+ +(ok|FAIL) " /tmp/suite-c.log  | awk '{print $1, $NF}' | sort > /tmp/fp-c.txt
        grep -E "^[a-z0-9-]+ +(ok|FAIL) " /tmp/suite-rs.log | awk '{print $1, $NF}' | sort > /tmp/fp-rs.txt
        test -s /tmp/fp-c.txt || { echo "::error::no fingerprints parsed from the C run"; exit 1; }
        if ! diff -u /tmp/fp-c.txt /tmp/fp-rs.txt; then
          echo "::error::archives differ between the C and Rust codec builds"
          exit 1
        fi
        echo "archives identical across $(wc -l < /tmp/fp-c.txt) configurations"

  # ── AddressSanitizer on x86-64 ──────────────────────────────────────────────
  # Added to diagnose a double free that only appeared on this runner. It found
  # that one and an out-of-bounds read in Dict/phase1 on its first two runs, and
  # now passes, so it is kept as a real check rather than deleted.
  #
  # It is deliberately NOT continue-on-error. That flag was right while the job
  # was expected to fail, but on a green job it would swallow exactly the
  # regressions this exists to catch.
  #
  # Cost: roughly doubles the Linux CI time. The memory bugs in this codebase
  # have consistently been invisible at every warning level, produced different
  # symptoms per platform, and in two cases corrupted the heap silently on
  # x86-64 while crashing elsewhere -- so the trade is worth it. If the time
  # becomes a problem, narrow the case list before dropping the job.
  asan-x86_64:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6.0.2
      with:
        lfs: false
    - name: Install LLVM and Clang
      uses: KyleMayes/install-llvm-action@v2
      with:
        version: "21.1.8"
    - name: Install packages
      run: |
        sudo apt-get update
        sudo apt-get install -y liblua5.1-dev libncurses-dev libcurl4-openssl-dev cpphs
    - name: Install MicroHs
      run: |
        microhs_sha="05a3fbd5d73ae6a37111a6ced5b57bb1717b8975"
        microhs_tar="/tmp/microhs.tar.gz"
        microhs_expected_sha256="a1f85821cbae877d0ea3e173235d45c833d9145b2ca9e92e77d284b6730c63b6"
        curl -fsSL "https://github.com/augustss/MicroHs/archive/$microhs_sha.tar.gz" -o "$microhs_tar"
        echo "$microhs_expected_sha256  $microhs_tar" | sha256sum -c -
        tar -xzf "$microhs_tar" -C /tmp
        cd "/tmp/MicroHs-$microhs_sha"
        make minstall
        echo "$HOME/.mcabal/bin" >> "$GITHUB_PATH"
    - name: Build with AddressSanitizer
      run: |
        chmod +x compile* Compression/compile
        DARC_SANITIZE=address ./compile
    # detect_leaks=0: this is a hunt for a specific heap-corruption bug, and
    # LeakSanitizer would otherwise bury the report under leaks inherited from
    # a codebase that has never been leak-clean.
    # abort_on_error=1 makes the first report terminate rather than letting a
    # corrupted process wander on and produce a confusing second failure.
    - name: Run suite under ASan
      env:
        ASAN_OPTIONS: detect_leaks=0:abort_on_error=1:print_stacktrace=1
      run: |
        chmod +x Tests/*.sh
        Tests/run-tests.sh Tests/arc
    # The suite hides per-case output on success, so surface any ASan report
    # that landed in a per-configuration log even when the case was recorded
    # as a failure rather than a crash.
    - name: Surface ASan reports
      if: always()
      run: |
        work="${TMPDIR:-/tmp}/darc-tests-work"
        found=0
        for f in "$work"/*.log; do
          [ -f "$f" ] || continue
          if grep -q "AddressSanitizer" "$f"; then
            found=1
            echo "::group::$(basename "$f")"
            cat "$f"
            echo "::endgroup::"
          fi
        done
        [ "$found" = 1 ] || echo "no AddressSanitizer reports found in $work"
