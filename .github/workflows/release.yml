name: Release

# Builds the release binaries and attaches them to the GitHub release for the
# pushed tag. Deliberately separate from Build CI: that runs on every push and
# should stay fast, while this only runs when a version is cut.
#
# The install steps below are copied from build.yml rather than shared, and the
# MicroHs pin (commit + sha256) must be kept identical to it. A release built
# against a different compiler revision than CI validates would be a silent
# difference between what is tested and what is shipped.
#
# The two Windows targets use different toolchains -- Debian's mingw-w64 (GCC)
# for amd64, llvm-mingw (Clang) for arm64, because Debian packages x86_64 and
# i686 only -- and are verified differently: amd64 under Wine on the runner
# that built it, arm64 on a real windows-11-arm runner, since Wine has no ARM64
# emulation. publish waits on both.

on:
  push:
    tags: [ "v*" ]
  # Lets the assets be rebuilt for an existing tag without re-tagging.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach assets to (e.g. v2.0.0)"
        required: true

permissions:
  contents: write        # required to upload release assets

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  MICROHS_SHA: "05a3fbd5d73ae6a37111a6ced5b57bb1717b8975"
  MICROHS_SHA256: "a1f85821cbae877d0ea3e173235d45c833d9145b2ca9e92e77d284b6730c63b6"

jobs:
  # ── Native builds: Linux amd64/arm64 and macOS arm64 ─────────────────────────
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-amd64
          - os: ubuntu-24.04-arm
            label: linux-arm64
          - os: macos-latest
            label: macos-arm64
    steps:
    - uses: actions/checkout@v6.0.2
      with:
        lfs: false
        ref: ${{ github.event.inputs.tag || github.ref }}

    - name: Install LLVM and Clang
      if: runner.os == 'Linux'
      uses: KyleMayes/install-llvm-action@v2
      with:
        version: "21.1.8"

    - name: Install packages (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y liblua5.1-dev libncurses-dev libcurl4-openssl-dev cpphs

    - name: Install packages (macOS)
      if: runner.os == 'macOS'
      run: brew install ncurses || true

    - name: Install MicroHs
      run: |
        set -euo pipefail
        curl -fsSL "https://github.com/augustss/MicroHs/archive/$MICROHS_SHA.tar.gz" -o /tmp/microhs.tar.gz
        if command -v sha256sum >/dev/null; then
          echo "$MICROHS_SHA256  /tmp/microhs.tar.gz" | sha256sum -c -
        else
          echo "$MICROHS_SHA256  /tmp/microhs.tar.gz" | shasum -a 256 -c -
        fi
        tar -xzf /tmp/microhs.tar.gz -C /tmp
        cd "/tmp/MicroHs-$MICROHS_SHA"
        make minstall
        echo "$HOME/.mcabal/bin" >> "$GITHUB_PATH"

    - name: Build
      run: |
        chmod +x compile*
        ./compile-O2

    - name: Verify binary
      run: |
        test -s Tests/arc || { echo "::error::build produced no Tests/arc"; exit 1; }
        chmod +x Tests/arc
        ./Tests/arc | head -1

    # Round-tripping here rather than trusting Build CI: this is the artifact
    # users actually receive, and it is built by a different workflow.
    - name: Round-trip the release binary
      run: |
        cd Tests
        ./run-tests.sh ./arc

    - name: Package
      run: |
        set -euo pipefail
        # NB: an "[ test ] && a && b" chain here would return non-zero on the
        # normal tag-push path and set -e would kill the step.
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          ver="${{ github.event.inputs.tag }}"
        else
          ver="$GITHUB_REF_NAME"
        fi
        ver="${ver#v}"
        stage="darc-$ver-${{ matrix.label }}"
        mkdir -p "dist/$stage"
        cp Tests/arc "dist/$stage/arc"
        # arc.groups is the solid-ordering config the binary reads; shipping the
        # binary without it changes how archives are grouped.
        cp Tests/arc.groups "dist/$stage/arc.groups"
        cp README.md LICENSE "dist/$stage/" 2>/dev/null || true
        tar -czf "dist/$stage.tar.gz" -C dist "$stage"
        rm -rf "dist/$stage"
        ls -l dist/

    - uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.label }}
        path: dist/*
        if-no-files-found: error

  # ── Windows, cross-compiled from Linux ──────────────────────────────────────
  # amd64 uses Debian's mingw-w64 (GCC); arm64 uses llvm-mingw (Clang), because
  # Debian packages x86_64 and i686 only. See compile-win64-c.
  #
  # amd64 is smoke-tested here under Wine. arm64 cannot be -- Wine has no ARM64
  # emulation -- so it is verified on a real ARM64 Windows runner in the
  # windows-arm64-verify job below, which publish waits for.
  windows-cross:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            label: windows-amd64
            exe: arc-mhs-win64.exe
          - arch: aarch64
            label: windows-arm64
            exe: arc-mhs-win-arm64.exe
    steps:
    - uses: actions/checkout@v6.0.2
      with:
        lfs: false
        ref: ${{ github.event.inputs.tag || github.ref }}

    - name: Install cross toolchain and Wine
      if: matrix.arch == 'x86_64'
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends mingw-w64 mingw-w64-tools cpphs wine64 wine

    - name: Install llvm-mingw
      if: matrix.arch == 'aarch64'
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends cpphs
        # Pinned with a checksum for the same reason MicroHs is: the compiler is
        # part of what produces the shipped binary.
        ver="20260616"
        tarball="llvm-mingw-$ver-ucrt-ubuntu-22.04-x86_64.tar.xz"
        sha256="534b92e067b22a6b4441f48ae9240a3341b17825d04d577eab0cf85c44b4deda"
        curl -fsSL "https://github.com/mstorsjo/llvm-mingw/releases/download/$ver/$tarball" -o /tmp/"$tarball"
        echo "$sha256  /tmp/$tarball" | sha256sum -c -
        tar -xJf /tmp/"$tarball" -C /opt
        echo "/opt/llvm-mingw-$ver-ucrt-ubuntu-22.04-x86_64/bin" >> "$GITHUB_PATH"

    - name: Install MicroHs
      run: |
        set -euo pipefail
        curl -fsSL "https://github.com/augustss/MicroHs/archive/$MICROHS_SHA.tar.gz" -o /tmp/microhs.tar.gz
        echo "$MICROHS_SHA256  /tmp/microhs.tar.gz" | sha256sum -c -
        tar -xzf /tmp/microhs.tar.gz -C /tmp
        cd "/tmp/MicroHs-$MICROHS_SHA"
        make minstall
        echo "$HOME/.mcabal/bin" >> "$GITHUB_PATH"

    - name: Build (Windows cross)
      run: |
        chmod +x compile-win64-c compile-mhs-win64
        DARC_WIN_ARCH=${{ matrix.arch }} ./compile-mhs-win64

    # compile-mhs-win64 checks the PE machine field itself, which is the only
    # thing that distinguishes these two artifacts -- `file` reports both as
    # "PE32+ executable (console)", so a build that silently fell back to the
    # wrong toolchain would pass a `file` check.
    - name: Verify binary
      run: |
        test -s "Tests/${{ matrix.exe }}" || { echo "::error::no Tests/${{ matrix.exe }}"; exit 1; }
        echo "binary: $(wc -c < "Tests/${{ matrix.exe }}") bytes"

    # Only amd64 can be exercised on this runner. arm64 is exercised on real
    # hardware in windows-arm64-verify below.
    - name: Smoke-test under Wine
      if: matrix.arch == 'x86_64'
      run: |
        chmod +x Tests/win-test.sh
        Tests/win-test.sh "Tests/${{ matrix.exe }}"

    - name: Package
      run: |
        set -euo pipefail
        # NB: an "[ test ] && a && b" chain here would return non-zero on the
        # normal tag-push path and set -e would kill the step.
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          ver="${{ github.event.inputs.tag }}"
        else
          ver="$GITHUB_REF_NAME"
        fi
        ver="${ver#v}"
        stage="darc-$ver-${{ matrix.label }}"
        mkdir -p "dist/$stage"
        cp "Tests/${{ matrix.exe }}" "dist/$stage/arc.exe"
        cp Tests/arc.groups "dist/$stage/arc.groups"
        cp README.md LICENSE "dist/$stage/" 2>/dev/null || true
        (cd dist && zip -r "$stage.zip" "$stage" >/dev/null)
        rm -rf "dist/$stage"
        ls -l dist/

    - uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.label }}
        path: dist/*
        if-no-files-found: error

  # ── Exercise the ARM64 Windows artifact on real ARM64 Windows ───────────────
  # publish waits on this, so an arm64 binary that builds but cannot create an
  # archive never reaches the release. It unpacks the artifact that will
  # actually be uploaded rather than rebuilding, so what runs is what ships.
  windows-arm64-verify:
    needs: windows-cross
    runs-on: windows-11-arm
    steps:
    - uses: actions/checkout@v6.0.2
      with:
        lfs: false
        ref: ${{ github.event.inputs.tag || github.ref }}

    - uses: actions/download-artifact@v4
      with:
        name: windows-arm64
        path: dist

    - name: Unpack and smoke-test
      shell: bash
      run: |
        set -euo pipefail
        zip=$(ls dist/*.zip)
        unzip -q "$zip" -d unpacked
        exe=$(ls unpacked/*/arc.exe)
        echo "testing $exe from $zip"
        # Invoked through bash rather than directly: a Windows checkout does not
        # preserve the executable bit.
        bash Tests/win-test.sh "$exe"

  # ── Attach everything to the release ────────────────────────────────────────
  publish:
    needs: [ build, windows-cross, windows-arm64-verify ]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: dist
        merge-multiple: true

    - name: Checksums
      run: |
        cd dist
        sha256sum * > SHA256SUMS
        cat SHA256SUMS

    # Uploads to the release for this tag. If a draft was prepared in advance
    # (with hand-written notes) this attaches to it and leaves the notes alone;
    # otherwise a draft is created so nothing is published unreviewed.
    - name: Attach assets to the release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        tag="${{ github.event.inputs.tag || github.ref_name }}"
        if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          echo "No release for $tag yet; creating a draft."
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft \
             --title "$tag" --notes "Assets built by the Release workflow."
        fi
        gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber dist/*
        gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets \
           -q '.assets[] | "  uploaded: \(.name) (\(.size) bytes)"'
