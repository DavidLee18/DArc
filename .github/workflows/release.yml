name: Release

# Builds the release binaries and attaches them to the GitHub release for the
# pushed tag. Deliberately separate from Build CI: that runs on every push and
# should stay fast, while this only runs when a version is cut.
#
# The toolchain setup is SHARED with build.yml, through the composite actions in
# .github/actions/. It used to be copied, and the copy drifted: three faults
# stopped v3.0.0 being cut, each hidden behind the last, and every one of them
# was a step build.yml had and this file did not. Nothing could catch that,
# because this workflow only runs on a tag push while build.yml runs on every
# commit -- so the copies were compared roughly once a year.
#
# Do not reintroduce an inline copy of a setup step. If a step is needed here
# and in build.yml, it belongs in .github/actions/, where build.yml exercises it
# on every push. The Rust pin is rust-toolchain.toml; the ARM64 link flags are
# /.cargo/config.toml.
#
# The two Windows targets use different toolchains -- Debian's mingw-w64 (GCC)
# for amd64, llvm-mingw (Clang) for arm64, because Debian packages x86_64 and
# i686 only -- and are verified differently: amd64 under Wine on the runner
# that built it, arm64 on a real windows-11-arm runner, since Wine has no ARM64
# emulation. publish waits on both.

on:
  push:
    tags: [ "v*" ]
  # Lets the assets be rebuilt for an existing tag without re-tagging.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach assets to (e.g. v2.0.0)"
        required: true

permissions:
  contents: write        # required to upload release assets

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

# Timeouts, on the same policy as build.yml -- 30 minutes a job, 10 on the
# package installs -- and applied here for the reason this file exists to be
# careful about: it is a near-copy of build.yml that ONLY a tag push can run,
# so a divergence between the two cannot be discovered until a release is
# being cut. A hang here holds a release rather than a PR.
jobs:
  # ── Native builds: Linux amd64/arm64 and macOS arm64 ─────────────────────────
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-amd64
          - os: ubuntu-24.04-arm
            label: linux-arm64
          - os: macos-latest
            label: macos-arm64
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        lfs: false
        ref: ${{ github.event.inputs.tag || github.ref }}

    # Fail in seconds rather than after a 25-minute matrix: the tag being built
    # must be the version the tree declares. Through v1, v2 and the whole port
    # the crates said 0.1.0 while the tags said otherwise, and nothing noticed
    # because nothing compared them -- CARGO_PKG_VERSION is user-visible (it is
    # the HTTP User-Agent for `--original=<url>`), so every release so far
    # identified itself to remote servers as a pre-release.
    - name: Tag must match the crate version
      run: |
        set -euo pipefail
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          ver="${{ github.event.inputs.tag }}"
        else
          ver="$GITHUB_REF_NAME"
        fi
        ver="${ver#v}"
        # The one place the version is written; every member inherits it.
        crate=$(sed -n 's/^version = "\(.*\)"$/\1/p' rust/Cargo.toml | head -1)
        [ -n "$crate" ] || { echo "::error::no version in rust/Cargo.toml"; exit 1; }
        echo "tag=$ver  crate=$crate"
        [ "$ver" = "$crate" ] || {
          echo "::error::tag $ver does not match rust/Cargo.toml version $crate"
          exit 1; }

    # This one had no Cache LLVM step beside it, unlike build.yml's -- a fourth
    # drift between the two copies, costing only time rather than correctness.
    # The action carries the cache, so it is fixed by using it.
    - uses: ./.github/actions/llvm
      if: runner.os == 'Linux'

    - name: Install packages (Linux)
      timeout-minutes: 10
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libncurses-dev

    - name: Install packages (macOS)
      # Best-effort, as in build.yml: bounded, but a timeout must not fail
      # the job where a failing brew does not.
      timeout-minutes: 10
      continue-on-error: true
      if: runner.os == 'macOS'
      run: brew install ncurses || true

    # Rust is no longer optional once DARC_RUST is the default: it compiles code
    # that ships in every binary. The version and the cross targets come from
    # rust-toolchain.toml so there is a single place to change them.
    - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
    - uses: ./.github/actions/cargo-cache
    # unarc is built here for the same reason darc.groups is copied below: it is
    # not an optional extra. It is the SFX module, so a release without it
    # cannot answer `darc a -sfx<module>` with anything -- there is nothing on
    # disk to prepend. Every release before this one shipped that gap.
    - name: Build
      run: |
        cargo build --release --manifest-path rust/Cargo.toml -p darc-arc --bin darc
        cargo build --release --manifest-path rust/Cargo.toml -p darc-unarc

    - name: Verify binary
      run: |
        test -s rust/target/release/darc || { echo "::error::build produced no darc"; exit 1; }
        test -s rust/target/release/unarc || { echo "::error::build produced no unarc"; exit 1; }
        ./rust/target/release/darc | head -1

    # Round-tripping here rather than trusting Build CI: this is the artifact
    # users actually receive, and it is built by a different workflow.
    - name: Round-trip the release binary
      run: |
        Tests/run-tests.sh rust/target/release/darc

    - name: Package
      run: |
        set -euo pipefail
        # NB: an "[ test ] && a && b" chain here would return non-zero on the
        # normal tag-push path and set -e would kill the step.
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          ver="${{ github.event.inputs.tag }}"
        else
          ver="$GITHUB_REF_NAME"
        fi
        ver="${ver#v}"
        stage="darc-$ver-${{ matrix.label }}"
        mkdir -p "dist/$stage"
        cp rust/target/release/darc "dist/$stage/darc"
        # The extractor, and the module `-sfx` prepends. Both roles, one file.
        cp rust/target/release/unarc "dist/$stage/unarc"
        # darc.groups is the solid-ordering config the binary reads; shipping the
        # binary without it changes how archives are grouped.
        cp Tests/darc.groups "dist/$stage/darc.groups"
        cp README.md LICENSE "dist/$stage/" 2>/dev/null || true
        tar -czf "dist/$stage.tar.gz" -C dist "$stage"
        rm -rf "dist/$stage"
        ls -l dist/

    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ${{ matrix.label }}
        path: dist/*
        if-no-files-found: error

  # ── Windows, cross-compiled from Linux ──────────────────────────────────────
  # amd64 uses Debian's mingw-w64 (GCC); arm64 uses llvm-mingw (Clang), because
  # Debian packages x86_64 and i686 only. See compile-win64-c.
  #
  # amd64 is smoke-tested here under Wine. arm64 cannot be -- Wine has no ARM64
  # emulation -- so it is verified on a real ARM64 Windows runner in the
  # windows-arm64-verify job below, which publish waits for.
  windows-cross:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            label: windows-amd64
            exe: darc-win64.exe
            unarc-exe: unarc-win64.exe
            rust-target: x86_64-pc-windows-gnu
          - arch: aarch64
            label: windows-arm64
            exe: darc-win-arm64.exe
            unarc-exe: unarc-win-arm64.exe
            rust-target: aarch64-pc-windows-gnullvm
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        lfs: false
        ref: ${{ github.event.inputs.tag || github.ref }}

    - name: Install cross toolchain and Wine
      # Same measurement as build.yml: this one downloads ~150 MB.
      timeout-minutes: 25
      if: matrix.arch == 'x86_64'
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends mingw-w64 mingw-w64-tools wine64 wine

    # These two were the drift that stopped v3.0.0: build.yml's ARM64 job has
    # had them since c7a12c2 and this workflow never did, so the first release
    # run built four platforms and failed the fifth on a commit whose Build CI
    # was green. They are now the same definition, not a copy of it, and
    # build.yml exercises that definition on every push -- which is the only
    # thing that can test a workflow that itself runs only on a tag.
    - uses: ./.github/actions/llvm-mingw
      if: matrix.arch == 'aarch64'
    - uses: ./.github/actions/llvm
      if: matrix.arch == 'aarch64'
      with:
        libclang: 'true'

    # Rust is no longer optional once DARC_RUST is the default: it compiles code
    # that ships in every binary. The version and the cross targets come from
    # rust-toolchain.toml so there is a single place to change them.
    - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
    - uses: ./.github/actions/cargo-cache
    - name: Build (Windows cross)
      run: |
        set -euo pipefail
        # The ARM64 static-link flags are NOT here any more: they are a
        # target-scoped entry in /.cargo/config.toml, so both workflows and a
        # local cross-build get them from one place and no RUSTFLAGS line can go
        # missing from one copy again. Do not reintroduce a RUSTFLAGS env var
        # here -- it would override that config wholesale.
        cargo build --release --manifest-path rust/Cargo.toml \
          --target ${{ matrix.rust-target }} -p darc-arc --bin darc
        cargo build --release --manifest-path rust/Cargo.toml \
          --target ${{ matrix.rust-target }} -p darc-unarc
        mkdir -p Tests
        cp "rust/target/${{ matrix.rust-target }}/release/darc.exe" "Tests/${{ matrix.exe }}"
        cp "rust/target/${{ matrix.rust-target }}/release/unarc.exe" "Tests/${{ matrix.unarc-exe }}"

    # compile-mhs-win64 used to check the PE machine field against the requested
    # architecture, so a build that silently fell back to the wrong toolchain
    # failed there. With that script gone the check lives here. Note the old
    # `file ... | grep PE32+` form could not have caught it: that string is
    # identical for both targets, which is why this matches the machine name.
    - name: Verify binary
      run: |
        # Both binaries, not just darc: unarc IS the SFX module, and if its
        # build step is ever dropped nothing else in this workflow would
        # notice -- the archive tools would still package and still pass.
        for f in "Tests/${{ matrix.exe }}" "Tests/${{ matrix.unarc-exe }}"; do
          test -s "$f" || { echo "::error::no $f"; exit 1; }
          desc=$(file -b "$f")
          echo "$f: $desc"
          case "${{ matrix.arch }}:$desc" in
            x86_64:*x86-64*|x86_64:*x86_64*)      ;;
            aarch64:*Aarch64*|aarch64:*ARM64*|aarch64:*aarch64*) ;;
            *) echo "::error::${{ matrix.arch }} build produced: $desc"; exit 1 ;;
          esac
          echo "binary: $(wc -c < "$f") bytes"
        done

    # Only amd64 can be exercised on this runner. arm64 is exercised on real
    # hardware in windows-arm64-verify below.
    - name: Smoke-test under Wine
      if: matrix.arch == 'x86_64'
      run: |
        chmod +x Tests/win-test.sh
        Tests/win-test.sh "Tests/${{ matrix.exe }}"

    - name: Package
      run: |
        set -euo pipefail
        # NB: an "[ test ] && a && b" chain here would return non-zero on the
        # normal tag-push path and set -e would kill the step.
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          ver="${{ github.event.inputs.tag }}"
        else
          ver="$GITHUB_REF_NAME"
        fi
        ver="${ver#v}"
        stage="darc-$ver-${{ matrix.label }}"
        mkdir -p "dist/$stage"
        cp "Tests/${{ matrix.exe }}" "dist/$stage/darc.exe"
        cp "Tests/${{ matrix.unarc-exe }}" "dist/$stage/unarc.exe"
        cp Tests/darc.groups "dist/$stage/darc.groups"
        cp README.md LICENSE "dist/$stage/" 2>/dev/null || true
        (cd dist && zip -r "$stage.zip" "$stage" >/dev/null)
        rm -rf "dist/$stage"
        ls -l dist/

    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ${{ matrix.label }}
        path: dist/*
        if-no-files-found: error

  # ── Exercise the ARM64 Windows artifact on real ARM64 Windows ───────────────
  # publish waits on this, so an arm64 binary that builds but cannot create an
  # archive never reaches the release. It unpacks the artifact that will
  # actually be uploaded rather than rebuilding, so what runs is what ships.
  windows-arm64-verify:
    needs: windows-cross
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        lfs: false
        ref: ${{ github.event.inputs.tag || github.ref }}

    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: windows-arm64
        path: dist

    - name: Unpack and smoke-test
      shell: bash
      run: |
        set -euo pipefail
        zip=$(ls dist/*.zip)
        unzip -q "$zip" -d unpacked
        # darc.exe, not arc.exe: the console binary was renamed and this line
        # was not, so `ls` found nothing, `set -e` killed the step, and publish
        # -- which waits on this job -- could never run. A release has not been
        # cut since, which is why it went unnoticed.
        exe=$(ls unpacked/*/darc.exe)
        test -s "$(dirname "$exe")/unarc.exe" || { echo "::error::no unarc.exe in the arm64 package"; exit 1; }
        echo "testing $exe from $zip"
        # Invoked through bash rather than directly: a Windows checkout does not
        # preserve the executable bit.
        bash Tests/win-test.sh "$exe"

        # unarc too, and on this runner only: build.yml builds unarc for
        # x86_64 Windows but NOT for ARM64, so unarc-win-arm64.exe is produced
        # by this workflow alone and no CI job has ever executed it. It shipped
        # in whatever state it was built in.
        #
        # No args makes it print its usage to stderr and exit non-zero, which
        # is the point: reaching its own usage text proves the image loaded and
        # ran to argument parsing. A binary missing its DLLs dies in the loader
        # before main and prints nothing of its own -- the failure this job just
        # caught in darc.exe, which unarc.exe would have shared in silence.
        unarc="$(dirname "$exe")/unarc.exe"
        out=$("$unarc" 2>&1 || true)
        echo "$out"
        case "$out" in
          *"Usage:"*) echo "unarc.exe runs" ;;
          *) echo "::error::unarc.exe did not reach its usage text"; exit 1 ;;
        esac

  # ── Attach everything to the release ────────────────────────────────────────
  publish:
    needs: [ build, windows-cross, windows-arm64-verify ]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        path: dist
        merge-multiple: true

    - name: Checksums
      run: |
        cd dist
        sha256sum * > SHA256SUMS
        cat SHA256SUMS

    # Uploads to the release for this tag. If a draft was prepared in advance
    # (with hand-written notes) this attaches to it and leaves the notes alone;
    # otherwise a draft is created so nothing is published unreviewed.
    - name: Attach assets to the release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        tag="${{ github.event.inputs.tag || github.ref_name }}"
        if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          echo "No release for $tag yet; creating a draft."
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft \
             --title "$tag" --notes "Assets built by the Release workflow."
        fi
        gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber dist/*
        gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets \
           -q '.assets[] | "  uploaded: \(.name) (\(.size) bytes)"'
